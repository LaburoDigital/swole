/* ============ Generador de rutinas (basado en la evidencia) ============
   Lo que usa, en criollo:
   - Hipertrofia: crecés con rangos amplios (≈6 a 30 reps) si llegás cerca del fallo; lo que más pesa es el VOLUMEN:
     ~10 a 20 series efectivas por músculo por semana, repartidas en 2 o más días (Schoenfeld y col., 2016-2017).
   - Fallo: no hace falta llegar al fallo; quedarse a 1-3 repeticiones da resultados parecidos con menos fatiga (Grgic y col., 2022; Refalo y col., 2022).
   - Descanso: más de 60 s entre series ayuda a crecer; en los básicos pesados, 2-3 min (Singer y col., 2024).
   - Fuerza: pocas repeticiones (≈3-6) con carga alta en los básicos.
   - Menores: el entrenamiento de fuerza bien hecho y supervisado es seguro y no frena el crecimiento (NSCA 2009; consenso 2014),
     pero priorizamos técnica y evitamos máximos.
   - Articulaciones: cargar progresivamente no daña el cartílago; lo que lastima son los saltos bruscos de carga. Por eso el
     calentamiento automático y subir de a poco. */
const GEN_GOALS={hip:{n:'Ganar músculo',i:'muscle',rest:120},fuerza:{n:'Ganar fuerza',i:'dumb',rest:180},dep:{n:'Rendir en mi deporte',i:'trophy',rest:120},

const GEN_LVL={beg:'Principiante',int:'Intermedio',adv:'Avanzado'};
/* el objetivo que manda en series y repeticiones (calistenia se suma como bloque de habilidades) */
const primGoal=gs=>gs.find(g=>g!=='cali')||'hip';
const POOL={

    rot:['russian'],biceps:['dbcurl','hammer'],triceps:['diamond','benchdip'],lateral:['lateral'],rear:['dbrow','austrow','lateral'],plyo:['jumpsquat'],
    power:['kbswing'],carry:['farmer'],neck:['neckiso'],adductor:['copenhagen'],forearm:['hammer','farmer'],lumbar:['nordic'],ext:['airsquat'],fly:['dbfly']},

};
const DAYT={
  fullA:{n:'Cuerpo completo A',p:['squat','hpush','hpull','hinge','core']},
  fullB:{n:'Cuerpo completo B',p:['hinge','vpush','vpull','lunge','core']},

  upB:{n:'Torso B',p:['vpush','vpull','hpush','hpull','lateral','rear']},
  lowA:{n:'Piernas A',p:['squat','hinge','lunge','hcurl','calf','core'],low:1},
  lowB:{n:'Piernas B',p:['hinge','squat','lunge','ext','calf','rot'],low:1},
  push:{n:'Empuje',p:['hpush','vpush','fly','lateral','triceps']},

function genSplit(n,gs,lvl){
  const prim=primGoal(gs),onlyCali=gs.length===1&&gs[0]==='cali';
  if(onlyCali)return['skPush','skPull','skLegs','skPush','skPull','skLegs'].slice(0,n);
  if(n<=2)return['fullA','fullB'];
  if(n===3)return lvl==='beg'||prim==='dep'||prim==='grasa'||prim==='salud'?['fullA','fullB','fullC']:['upA','lowA','fullC'];
  if(n===4)return['upA','lowA','upB','lowB'];
  if(n===5)return['upA','lowA','push','pull','legs'];
  return['push','pull','legs','push','pull','legs'];
}
/* series × repeticiones según la evidencia */
function genDose(ex,gs,lvl,pat,first,age){
  const prim=primGoal(gs),big=['squat','hinge','hpush','vpush','hpull','vpull'].includes(pat)&&first;
  if(ex.time){const s={plank:40,lsit:20,tucklsit:20,copenhagen:25,farmer:40,neckiso:20}[ex.id]||(ex.sk?15:30);return[ex.sk?4:3,lvl==='adv'?Math.round(s*1.5):s];}
  if(pat==='plyo'||pat==='power')return[3,ex.id==='kbswing'?12:5];

/* reparte los días de gym evitando los días de deporte y las piernas el día antes de jugar */
function genDays(n,sport){
  const pref={2:[1,4],3:[1,3,5],4:[1,2,4,5],5:[1,2,3,5,6],6:[1,2,3,4,5,6]}[Math.min(6,Math.max(2,n))];
  const order=[1,2,3,4,5,6,0],out=[];
  pref.forEach(d=>{
    if(!sport.includes(d)&&!out.includes(d)){out.push(d);return;}
    const i=order.indexOf(d);
    for(let k=1;k<7;k++){for(const j of[i+k,i-k]){const c=order[(j+7)%7];if(!sport.includes(c)&&!out.includes(c)){out.push(c);return;}}}
    if(!out.includes(d))out.push(d);
  });

const SK_ROT=['hs','pull','lsit','push','fl','dip','pl','bl'];
function skillFor(i,lvl){
  const f=SK_ROT[i%SK_ROT.length],vs=skFam(f);if(!vs.length)return null;
  let cur=-1;vs.forEach((e,k)=>{if(bestE1(e.id))cur=k;});
  const base={beg:0,int:1,adv:2}[lvl];
  return vs[Math.min(vs.length-1,cur>=0?cur+1:base)];
}
/* series semanales por grupo: el principal cuenta 1, el secundario 0,5 */
function weekVolume(plan){
  const v={};Object.keys(GROUPS).forEach(g=>v[g]=0);
  const gOf=k=>Object.keys(GROUPS).find(g=>GROUPS[g].includes(k));
  plan.forEach(r=>r.items.forEach(it=>{const ex=exById(it.ex);if(!ex)return;const seen=new Set();
    ex.p.forEach(k=>{const g=gOf(k);if(g&&!seen.has(g)){v[g]+=it.sets;seen.add(g);}});
    ex.s.forEach(k=>{const g=gOf(k);if(g&&!seen.has(g)){v[g]+=it.sets*.5;seen.add(g);}});}));

}

function genPlan(d){

  const lvlI={beg:0,int:1,adv:2}[lvl];

  const days=wk.length?wk:genDays(+d.days||3,actDays),n=days.length;

    const after=dinfo.type&&dinfo.gym==='despues',before=dinfo.type&&dinfo.gym==='antes';
    const rep=arr.slice(0,di).filter(z=>z.t===s.t).length;

/* ============ Carta de atleta ============
   Una carta coleccionable con tu rango, tu figura pintada por nivel y 6 atributos del 0 al 99.
   Es un SVG completo (sin depender del CSS de la página) para poder exportarlo como imagen. */
const CARD_BG=[['#D49A62','#5E2F10'],['#F2F5FA','#76839C'],['#FFE07A','#A86600'],['#6BE6D5','#0B5F5A'],['#7DB8FF','#173A9E'],['#CF9BFF','#43168F'],['#FF7896','#6E0820']];
const CARD_NONE=['#3A4270','#141830'];

/* nivel continuo (0-18) → puntaje de carta (40-99) */
const rating=v=>v==null||v<0?null:Math.round(40+Math.min(18,v)/18*59);
function cardStats(){
  const r=rankedList().filter(x=>x.info.L>=0).map(x=>({ex:x.ex,v:x.info.L+clamp(x.info.pct,0,.999)}));
  const best=f=>{const l=r.filter(f);return l.length?Math.max(...l.map(x=>x.v)):null;};
  const top3=r.filter(x=>x.ex.st&&/^Barra/.test(x.ex.eq)).map(x=>x.v).sort((a,b)=>b-a).slice(0,3);
  const has=(x,ks)=>ks.includes(x.ex.p[0]);
  const v={
    FUE:top3.length?top3.reduce((s,x)=>s+x,0)/top3.length:null,
    EMP:best(x=>has(x,['pecho','hombros','triceps'])),
    TIR:best(x=>has(x,['dorsales','biceps','trapecio','antebrazos'])),
    PIE:best(x=>has(x,['cuadriceps','gluteos','isquios','gemelos','aductores'])),
    COR:best(x=>has(x,['abs','oblicuos','lumbar'])),
    CAL:best(x=>!!x.ex.sk)
  };
  const out={};ATTRS.forEach(([k])=>out[k]=rating(v[k]));
  const vals=Object.values(out).filter(x=>x!=null);
  out.OVR=vals.length?Math.round(vals.reduce((s,x)=>s+x,0)/vals.length):null;
  return out;
}

const REC_COL={red:'#FF5C7A',yellow:'#FFC34D',green:'#3CCB8A'};
function recovery(){
  const now=Date.now(),last={};
  db.logs.forEach(l=>{const t=parseK(l.date).getTime()+18*36e5;l.entries.forEach(en=>{const ex=exById(en.ex);if(!ex)return;const n=en.sets.filter(s=>!s.w).length;if(n<2)return;ex.p.forEach(k=>{if(!last[k]||t>last[k])last[k]=t;});});});
  /* tu semana: partido de ayer = piernas recién trabajadas; práctica = carga media */
  [1,2].forEach(back=>{const dk=addDays(today(),-back),di=dayInfo(parseK(dk).getDay());if(!di.type)return;
    const t=parseK(dk).getTime()+20*36e5-(di.type==='prac'?24*36e5:0),ms=['cuadriceps','isquios','gluteos','gemelos','aductores'].concat(['rugby','combate'].includes(di.sport)&&di.type==='match'?['trapecio','hombros','pecho','dorsales']:[]);
    ms.forEach(k=>{if(!last[k]||t>last[k])last[k]=t;});});
  const st={},hrs={};
  Object.keys(MUSC).forEach(k=>{const hh=last[k]?Math.max(0,(now-last[k])/36e5):Infinity;hrs[k]=hh;st[k]=hh<30?'red':hh<54?'yellow':'green';});
  /* grupos listos: todos sus músculos en verde, primero los que hace más que no entrenás */
  const ready=Object.keys(GROUPS).filter(g=>GROUPS[g].every(k=>st[k]==='green')).sort((a,b)=>Math.min(...GROUPS[b].map(k=>hrs[k]))-Math.min(...GROUPS[a].map(k=>hrs[k])));
  return{st,hrs,ready};
}

function todayPlan(seed){

/* cada rama va de lo más fácil a lo más difícil; "id:n" = ejercicio con meta propia de n repeticiones */
const TREE=[
  {f:'push',n:'Empuje',ids:['kneepush','pushup','diamond','archerpush','pppush','oapush','planchepush']},
  {f:'pull',n:'Tirón',ids:['austrow','pullup:10','lpullup','archerpull','muscleup','oapull']},
  {f:'dip',n:'Fondos',ids:['benchdip','dips:15','ringdip']},
  {f:'legs',n:'Piernas',ids:['airsquat','shrimp','pistol','dragon']},
  {f:'lsit',n:'L-sit',ids:['tucklsit','lsit','vsit']},
  {f:'hs',n:'Vertical',ids:['wallhs','freehs','hspu','freehspu']},
  {f:'fl',n:'Front lever',ids:['tuckfl','advfl','straddlefl','fullfl']},
  {f:'bl',n:'Back lever',ids:['tuckbl','straddlebl','fullbl']},
  {f:'pl',n:'Planche',ids:['tuckpl','advpl','straddlepl','fullpl']},
  {f:'flag',n:'Bandera',ids:['flag']}
];
/* requisitos de otras ramas (la fuerza base que hace falta antes) */
const XREQ={muscleup:[['dips',10]],lpullup:[['tucklsit',15]],tuckfl:[['pullup',8]],tuckbl:[['pullup',6],['dips',8]],tuckpl:[['pppush',10],['dips',15]],freehs:[['wallhs',45]],flag:[['pullup',12],['wallhs',45]],ringdip:[['dips',12]]};
const shortN=n=>n.replace(/ \(segundos\)/,'');
function bestRep(id){let b=0;allSess().forEach(l=>l.entries.forEach(en=>{if(en.ex===id)en.sets.forEach(s=>{if(!s.w&&+s.reps>b)b=+s.reps;});}));return b;}
function treeNode(s){const [id,t]=s.split(':'),ex=exById(id);return ex?{id,ex,t:+t||(ex.sk?ex.sk.t:10),time:!!ex.time}:null;}
const branches=()=>TREE.map(b=>Object.assign({},b,{nodes:b.ids.map(treeNode).filter(Boolean)}));
/* dominada = llegaste a la meta de esta o de cualquier variante más difícil de la misma rama */
const nodeDone=(b,i)=>b.nodes.slice(i).some(n=>bestRep(n.id)>=n.t);
function nodeState(b,i){
  const n=b.nodes[i],best=bestRep(n.id),done=nodeDone(b,i);
  const prevOk=i===0||nodeDone(b,i-1)||best>0;
  const reqs=(XREQ[n.id]||[]).map(([id,t])=>{const bb=bestRep(id);return{id,t,best:bb,ok:bb>=t};});
  const ok=prevOk&&reqs.every(r=>r.ok);
  return{n,best,done,pct:Math.min(1,best/n.t),avail:!done&&ok,locked:!done&&!ok,reqs,prevOk};
}
function findNode(id){const bs=branches();for(const b of bs){const i=b.nodes.findIndex(n=>n.id===id);if(i>=0)return{b,i};}return null;}
const nodeTier=ex=>ex.sk?Math.min(6,Math.floor(ex.sk.b/3)):1;

  }).join('');

function nodeDetail(id){
  const f=findNode(id);if(!f)return '';

/* fuerza que ayuda a cada habilidad (si entrenás sin equipo, se cambia por su versión con peso corporal) */
const SK_ACC={push:['dips','plank'],pull:['row','legraise'],dip:['pushup','plank'],legs:['bulgarian','calf'],lsit:['legraise','plank'],hs:['ohp','plank'],fl:['row','legraise'],bl:['dips','plank'],pl:['dips','plank'],flag:['legraise','ohp']};
const BW_ALT={row:'austrow',ohp:'pushup',bulgarian:'shrimp',calf:'airsquat'};
function skillPlan(id){
  const f=findNode(id);if(!f)return null;
  const b=f.b,ti=f.i,st=b.nodes.map((_,i)=>nodeState(b,i));
  /* arranca en la variante más difícil que ya venís practicando; si no, en la primera que te falta */
  const open=st.map((s,i)=>i).filter(i=>i<=ti&&!st[i].done),worked=open.filter(i=>st[i].best>0);
  let si=worked.length?worked[worked.length-1]:open.length?open[0]:ti;
  const step=st[si],P=genPrefs(),bw=P.eq==='bw'||P.goals.length===1&&P.goals[0]==='cali';
  /* práctica de habilidad: series cortas y de calidad, a ~70 % de tu máximo (lejos del fallo) */
  const dose=(n,best,main)=>{
    if(n.time){const h=best?Math.max(5,Math.min(n.t,Math.round(best*.7))):Math.max(5,Math.round(n.t*.4));return[main?6:3,h];}
    const r=best?Math.max(2,Math.min(n.t,Math.round(best*.7))):Math.max(3,Math.round(n.t*.3));return[main?5:3,r];
  };
  const items=[],d0=dose(step.n,step.best,true);
  items.push({ex:step.n.id,sets:d0[0],reps:d0[1]});
  if(si>0){const pv=st[si-1],d=dose(pv.n,pv.best,false);items.push({ex:pv.n.id,sets:d[0],reps:Math.max(d[1],pv.n.time?15:5)});}
  const reqs=(XREQ[step.n.id]||[]).concat(si!==ti?(XREQ[id]||[]):[]).filter(([rid,t])=>bestRep(rid)<t);
  reqs.forEach(([rid,t])=>{const e=exById(rid);if(!e||items.some(x=>x.ex===rid))return;const bb=bestRep(rid);items.push({ex:rid,sets:4,reps:e.time?Math.max(10,Math.round((bb||t*.5)*.8)):Math.max(3,Math.round((bb||t*.5)*.75))});});
  (SK_ACC[b.f]||[]).forEach(a=>{const aid=bw&&BW_ALT[a]?BW_ALT[a]:a,e=exById(aid);if(!e||items.some(x=>x.ex===aid))return;items.push({ex:aid,sets:3,reps:e.time?40:LOWER.includes(e.p[0])?10:8});});
  const tg=b.nodes[ti].ex,from=si>0?st[si-1].n.ex:null;
  const gap=Math.max(1,(tg.sk?tg.sk.b:4)-(from&&from.sk?from.sk.b:from?3:0));
  return{target:id,tg,b,path:st.slice(si,ti+1),done:st.slice(0,si),step:step.n,stepBest:step.best,items:items.slice(0,6),weeks:[Math.max(3,Math.round(gap*1.5)),Math.max(5,Math.round(gap*3))]};
}

/* ============ Qué tan fuerte sos: percentil, próximo rango y progreso ============ */
/* percentil a partir de un nivel con decimales (misma tabla que pctStronger) */
function pctFromV(v){
  if(v<0)return 3;
  const T=[[0,5],[3,25],[6,50],[9,68],[12,80],[15,90],[18,97]];
  for(let i=1;i<T.length;i++)if(v<=T[i][0]){const a=T[i-1],b=T[i];return Math.round(a[1]+(b[1]-a[1])*(v-a[0])/(b[0]-a[0]));}
  return 97;
}

/* el ejercicio que tenés más cerca de subir de rango (de los que cuentan para tu rango general) */
function nextRankHint(){
  const gl=groupLevels(),used=new Set([].concat(...Object.values(gl).filter(Boolean).map(x=>x.used.map(e=>e.id))));
  let best=null;
  rankedList().forEach(x=>{
    if(!used.has(x.ex.id)||x.info.next==null)return;
    const gap=1-clamp(x.info.pct,0,1);
    if(!best||gap<best.gap)best={ex:x.ex,gap,L:x.info.next};
  });
  if(!best)return null;
  /* el grupo más flojo: subirlo es lo que más mueve el promedio */
  const weak=Object.keys(gl).filter(g=>gl[g]).sort((a,b)=>gl[a].v-gl[b].v)[0];
  return{ex:best.ex,L:best.L,txt:needTxt(best.ex,best.L),weak:weak&&Object.values(gl).filter(Boolean).length>1?weak:null};
}
/* series efectivas por grupo en las últimas 8 semanas (de lunes a domingo) */
function weeklyGroupSets(n){
  const mon=d=>{const x=parseK(d),w=(x.getDay()+6)%7;return addDays(d,-w);};
  const w0=mon(today()),weeks=[];for(let i=n-1;i>=0;i--)weeks.push(addDays(w0,-7*i));
  const grid={};Object.keys(GROUPS).forEach(g=>grid[g]=weeks.map(()=>0));
  db.logs.forEach(l=>{const wi=weeks.indexOf(mon(l.date));if(wi<0)return;
    l.entries.forEach(en=>{const ex=exById(en.ex);if(!ex)return;const g=groupOf(ex),s=en.sets.filter(x=>!x.w).length;if(grid[g])grid[g][wi]+=s;});});
  return{weeks,grid};
}
function heatCard(){
  if(!db.logs.length)return '';
  const {weeks,grid}=weeklyGroupSets(8),[lo,hi]=volTarget(genPrefs().goals);
  const lvl=x=>x===0?0:x<lo*.5?1:x<lo?2:x<=hi*1.3?3:4;
  return '<div class="card"><div class="hd"><div><h3>Series por semana</h3><span class="mut sm-t">Cada cuadrado es una semana. Más intenso = más series.</span></div></div>'+
   '<div class="heat" style="--n:'+weeks.length+'"><span></span>'+weeks.map((w,i)=>'<small>'+(i===weeks.length-1?'Esta':parseK(w).getDate()+'/'+(parseK(w).getMonth()+1))+'</small>').join('')+
   Object.keys(GROUPS).map(g=>'<b>'+g+'</b>'+grid[g].map((x,i)=>'<i class="h'+lvl(x)+'" title="'+g+': '+x+' series la semana del '+esc(longDate(weeks[i]))+'">'+(x||'')+'</i>').join('')).join('')+'</div>'+
   '<div class="heat-leg"><span>Poco</span><i class="h1"></i><i class="h2"></i><i class="h3"></i><i class="h4"></i><span>Mucho</span></div></div>';
}
/* lo que más mejoraste en las últimas 4 semanas */
function improvements(){
  const cut=addDays(today(),-28),out=[];
  rankedList().forEach(x=>{
    let before=0,after=0;
    allSess().forEach(l=>l.entries.forEach(en=>{if(en.ex!==x.ex.id)return;en.sets.forEach(s=>{if(s.w)return;const e=e1(x.ex,s.kg,s.reps);if(l.date<cut)before=Math.max(before,e);else after=Math.max(after,e);});}));
    if(before>0&&after>before*1.005)out.push({ex:x.ex,d:after-before,rel:after/before-1});
  });
  return out.sort((a,b)=>b.rel-a.rel).slice(0,4);
}

/* novedades propias (se publican a tus amigos): entrenos, récords, subidas de nivel, logros, habilidades */
function addEv(o){o.d=o.d||today();db.settings.ev=[o].concat(db.settings.ev||[]).slice(0,40);}
const monthKey=d=>(d||today()).slice(0,7);
/* puntos de la temporada (mes): premian progresar, no ser el más fuerte */
const SEASON_PTS={w:10,pr:15,up:25,rank:60,sk:40,ach:10,mis:0};
function seasonStats(){
  const m=monthKey(),days=new Set(db.logs.filter(l=>l.date.slice(0,7)===m).map(l=>l.date));
  const ev=(db.settings.ev||[]).filter(e=>e.d&&e.d.slice(0,7)===m);
  const c={w:days.size,pr:0,up:0,rank:0,sk:0,ach:0};
  ev.forEach(e=>{if(c[e.k]!=null&&e.k!=='w')c[e.k]++;});
  c.mis=ev.filter(e=>e.k==='mis').length;
  const pts=Object.keys(c).reduce((s,k)=>s+c[k]*SEASON_PTS[k],0)+ev.filter(e=>e.k==='mis').reduce((s,e)=>s+(+e.p||0),0);
  return Object.assign({m,pts},c);
}
const SK_IDS=()=>[].concat(...TREE.map(b=>b.ids.map(s=>s.split(':')[0])));
function skillsMastered(){const out=[];branches().forEach(b=>b.nodes.forEach((n,i)=>{if(bestRep(n.id)>=n.t)out.push(n.id);}));return out;}
/* lo que ven tus amigos: rangos y niveles (ya ajustados por tu peso, edad y sexo), nunca tu peso, edad ni mail */
function publicSummary(){
  const ov=overall(),st=cardStats(),gl=groupLevels(),lifts={};
  rankedList().slice(0,24).forEach(x=>{const v=Math.max(-1,x.info.L+clamp(x.info.pct,0,.999));const o={v:Math.round(v*100)/100};
    if(x.ex.st&&!x.ex.sk&&db.profile&&db.profile.weight)o.r=Math.round(x.b.e/db.profile.weight*100)/100;lifts[x.ex.id]=o;});
  const groups={};Object.keys(gl).forEach(g=>{if(gl[g])groups[g]=Math.round(gl[g].v*100)/100;});
  return{v:1,ovr:ov?{L:ov.L,p:Math.round(ov.pct*100)/100}:null,pctl:ov?pctFromV(ov.L+ov.pct):null,card:st,groups,lifts,sk:skillsMastered(),
    season:seasonStats(),ev:(db.settings.ev||[]).slice(0,20),streak:streak(),sports:(db.profile&&db.profile.sports)||[],goal:db.settings.skillGoal?db.settings.skillGoal.id:null};
}
const Social=(()=>{
  let pub='',timer=null;
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const mkCode=()=>{let s='';const r=crypto.getRandomValues(new Uint8Array(6));r.forEach(x=>s+=A[x%A.length]);return s;};
  const on=()=>!!(db.settings.social&&db.settings.social.code&&Sync.user());
  const nick=()=>String((db.profile&&db.profile.nick)||'Atleta').slice(0,24);
  const errTxt=e=>{const m=String(e&&e.message||'');return /code_not_found/.test(m)?'No encontré ese código':/own_code/.test(m)?'Ese es tu propio código':/too_many/.test(m)?'Llegaste al máximo de 100 amigos':/no_profile/.test(m)?'Primero activá amigos':!navigator.onLine?'Sin conexión: probá más tarde':'No se pudo: '+m;};
  async function publish(force){
    if(!on())return;
    /* nuevas habilidades dominadas también son novedades */
    const sk=skillsMastered(),seen=db.settings.skSeen||null;
    if(seen){sk.filter(id=>!seen.includes(id)).forEach(id=>addEv({k:'sk',x:id}));}
    if(!seen||sk.length!==seen.length){db.settings.skSeen=sk;save();}
    const data=publicSummary(),body={user_id:Sync.user().id,code:db.settings.social.code,nick:nick(),data,updated_at:new Date().toISOString()};
    const h=JSON.stringify([body.code,body.nick,data]);if(!force&&h===pub)return;
    await Sync.req('/rest/v1/swole_public?on_conflict=user_id',{method:'POST',auth:true,headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body});
    pub=h;
  }
  function schedule(){if(!on())return;clearTimeout(timer);timer=setTimeout(()=>publish().catch(()=>{}),5000);}
  async function load(){
    if(!on())return null;
    try{await publish();}catch(e){}
    const rows=await Sync.req('/rest/v1/swole_public?select=user_id,code,nick,data,updated_at',{auth:true});
    const me=Sync.user().id;
    S.social={at:Date.now(),me:(rows||[]).find(r=>r.user_id===me)||null,friends:(rows||[]).filter(r=>r.user_id!==me)};
    return S.social;
  }
  async function enable(){
    if(!Sync.user()){S.m2={t:'login',d:{email:'',pw:'',mode:'up',busy:false}};render();toast('Para tener amigos necesitás una cuenta (así se guardan tus datos en la nube)');return;}
    for(let i=0;i<5;i++){
      const code=mkCode();db.settings.social={code,since:today()};
      try{await publish(true);save();await load();await addPending();return true;}
      catch(e){if(e.status!==409&&!/duplicate|unique/i.test(e.message)){db.settings.social=null;throw e;}}
    }
    db.settings.social=null;throw new Error('No se pudo crear el código');
  }
  async function disable(){
    if(Sync.user())await Sync.req('/rest/v1/swole_public?user_id=eq.'+Sync.user().id,{method:'DELETE',auth:true});
    db.settings.social=null;pub='';S.social=null;save();
  }
  async function add(code){
    code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(code.length!==6)throw new Error('code_len');
    await Sync.req('/rest/v1/rpc/swole_add_friend',{method:'POST',auth:true,body:{p_code:code}});
    await load();
  }
  async function remove(id){await Sync.req('/rest/v1/rpc/swole_remove_friend',{method:'POST',auth:true,body:{p_friend:id}});await load();}
  /* código que llegó por link (?amigo=XXXXXX) */
  async function addPending(){
    let c=null;try{c=localStorage.getItem('swole.pendFriend');}catch(e){}
    if(!c||!on())return;
    try{localStorage.removeItem('swole.pendFriend');}catch(e){}
    try{await add(c);toast('¡Listo! Ya son amigos');render();}catch(e){toast(errTxt(e));}
  }
  return{on,publish,schedule,load,enable,disable,add,remove,addPending,errTxt,link:()=>location.origin+location.pathname+'?amigo='+(db.settings.social?db.settings.social.code:'')};
})();

/* ============ Navegación moderna ============ */
const reducedMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAB_ORDER=['inicio','entrenar','niveles','nutri'];
/* cambio de pestaña con transición nativa del navegador (View Transitions); si no hay soporte, la animación de siempre */
function navTo(v,dir){
  const go=()=>{goTab(v);window.scrollTo(0,0);render();};
  const cur=TAB_ORDER.indexOf(S.tab),nx=TAB_ORDER.indexOf(v==='hoy'?'inicio':['rutinas','cal'].includes(v)?'entrenar':v);
  if(cur===nx&&!['rutinas','cal'].includes(v)){if(window.scrollY>40)window.scrollTo({top:0,behavior:'smooth'});else go();return;}
  try{navigator.vibrate&&navigator.vibrate(8);}catch(e){}
  if(!document.startViewTransition||reducedMotion()||document.visibilityState!=='visible'){go();return;}
  const back=dir?dir<0:nx>=0&&cur>=0&&nx<cur;
  document.documentElement.classList.toggle('vt-back',back);
  S.vt=true;
  const t=document.startViewTransition(()=>{go();});
  t.finished.finally(()=>{S.vt=false;document.documentElement.classList.remove('vt-back');});
}
/* deslizar a los costados cambia de pestaña (en el celu) */
(()=>{let x0=0,y0=0,t0=0,ok=false,dx=0,lock=null;
  const blocked=t=>t.closest('.scroll-x,.tb-row,.carta,.cmp,input,textarea,select,.set,.week,.chips,.seg,.heat,.qgrid.big,.ptiles,[data-noswipe]');
  document.addEventListener('touchstart',e=>{
    ok=false;lock=null;dx=0;
    if(window.innerWidth>=900||openLayers()||e.touches.length>1)return;
    if(!e.target.closest('#view')||blocked(e.target))return;
    ok=true;x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now();
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!ok)return;const x=e.touches[0].clientX-x0,y=e.touches[0].clientY-y0;
    if(!lock){if(Math.abs(x)>12||Math.abs(y)>12)lock=Math.abs(x)>Math.abs(y)*1.4?'x':'y';else return;}
    if(lock!=='x'){ok=false;return;}
    const i=TAB_ORDER.indexOf(S.tab),edge=(x>0&&i<=0)||(x<0&&i>=TAB_ORDER.length-1);
    dx=edge?x*.15:x;const v=$('#view');v.style.transition='none';v.style.transform='translateX('+(dx*.35)+'px)';v.style.opacity=String(1-Math.min(.35,Math.abs(dx)/600));
  },{passive:true});
  document.addEventListener('touchend',()=>{
    if(!ok)return;ok=false;const v=$('#view');v.style.transition='transform .25s cubic-bezier(.22,1,.36,1),opacity .25s';v.style.transform='';v.style.opacity='';
    if(lock!=='x')return;
    const i=TAB_ORDER.indexOf(S.tab),fast=Date.now()-t0<450;
    if(Math.abs(dx)>(fast?50:110)){const j=i+(dx<0?1:-1);if(j>=0&&j<TAB_ORDER.length){setTimeout(()=>{v.style.transition='';navTo(TAB_ORDER[j],dx<0?1:-1);},10);}}
  },{passive:true});
})();
/* al bajar: el título grande pasa al encabezado y la barra de abajo se esconde; al subir vuelve */
(()=>{let lastY=0,tick=false;
  const upd=()=>{tick=false;
    const maxY=Math.max(0,document.documentElement.scrollHeight-window.innerHeight),y=Math.min(Math.max(0,window.scrollY),maxY),b=document.body,t=$('#view .pg'),tt=$('#topT');
    if(t&&tt){const gone=t.getBoundingClientRect().bottom<64;b.classList.toggle('scrolled',gone);if(gone&&tt.textContent!==t.textContent)tt.textContent=t.textContent;}
    else b.classList.remove('scrolled');
    if(window.innerWidth<900&&!openLayers()){
      /* abajo del todo la barra queda visible (el rebote del celular ya no la hace parpadear) */
      if(maxY-y<90||y<80)b.classList.remove('navhide');
      else if(y>lastY+14)b.classList.add('navhide');
      else if(y<lastY-14)b.classList.remove('navhide');
    }else b.classList.remove('navhide');
    lastY=y;
  };
  window.addEventListener('scroll',()=>{if(!tick){tick=true;requestAnimationFrame(upd);}},{passive:true});
})();
/* tirar hacia abajo arriba de todo: sincroniza y actualiza */
(()=>{let y0=0,dy=0,on=false,busy=false;
  const ind=()=>$('#ptr');
  document.addEventListener('touchstart',e=>{on=false;if(busy||window.scrollY>0||openLayers()||e.touches.length>1||!e.target.closest('#view'))return;on=true;y0=e.touches[0].clientY;dy=0;},{passive:true});
  document.addEventListener('touchmove',e=>{if(!on)return;dy=e.touches[0].clientY-y0;if(dy<=0||window.scrollY>0){dy=0;const p=ind();if(p)p.style.cssText='';return;}
    const p=ind();if(!p)return;const k=Math.min(1,dy/90);p.style.opacity=String(k);p.style.transform='translate(-50%,'+(Math.min(dy,110)*.6)+'px) rotate('+(k*270)+'deg)';p.classList.toggle('ready',dy>90);},{passive:true});
  document.addEventListener('touchend',async()=>{if(!on)return;on=false;const p=ind();if(!p)return;
    if(dy<=90){p.style.cssText='';p.classList.remove('ready');return;}
    busy=true;p.classList.add('spin');p.style.transform='translate(-50%,54px)';p.style.opacity='1';
    try{navigator.vibrate&&navigator.vibrate(12);}catch(e){}
    try{if(Sync.user())await Sync.run(true);if(Social.on())await Social.load();}catch(e){}
    render();busy=false;p.classList.remove('spin','ready');p.style.cssText='';
    toast(Sync.user()?(Sync.state.s==='ok'?'Actualizado':'Sin conexión: se actualiza cuando vuelva internet'):'Todo al día');
  },{passive:true});
})();

/* ============ Misiones semanales y racha por semana ============ */
const weekStart=d=>{d=d||today();const w=(parseK(d).getDay()+6)%7;return addDays(d,-w);};
const weekTarget=()=>{const g=weekGymDays().length;return Math.max(1,g||db.settings.weekGoal||3);};
const trainDays=(a,b)=>new Set(db.logs.filter(l=>l.date>=a&&l.date<=b).map(l=>l.date)).size;
/* semanas seguidas cumpliendo tu meta de días (descansar no la corta; la semana en curso no la rompe) */
function weekStreak(){
  const T=weekTarget();let ws=weekStart(),n=0;
  if(trainDays(ws,addDays(ws,6))>=T)n++;
  for(let i=0;i<200;i++){ws=addDays(ws,-7);if(trainDays(ws,addDays(ws,6))>=T)n++;else break;}
  return n;
}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function missions(){
  const ws=weekStart(),we=addDays(ws,6),inW=d=>d&&d>=ws&&d<=we,T=weekTarget();
  const logs=db.logs.filter(l=>inW(l.date)),ev=(db.settings.ev||[]).filter(e=>inW(e.d));
  const sets={};Object.keys(GROUPS).forEach(g=>sets[g]=0);
  logs.forEach(l=>l.entries.forEach(en=>{const ex=exById(en.ex);if(ex)sets[groupOf(ex)]+=en.sets.filter(s=>!s.w).length;}));
  /* el grupo que menos venís entrenando (últimas 4 semanas) */
  const past={};Object.keys(GROUPS).forEach(g=>past[g]=0);
  db.logs.filter(l=>l.date>=addDays(ws,-28)&&l.date<ws).forEach(l=>l.entries.forEach(en=>{const ex=exById(en.ex);if(ex)past[groupOf(ex)]+=en.sets.length;}));
  const weak=Object.keys(past).filter(g=>g!=='Core').sort((a,b)=>past[a]-past[b])[0]||'Espalda';
  const before=new Set();db.logs.filter(l=>l.date<ws).forEach(l=>l.entries.forEach(en=>before.add(en.ex)));
  const newEx=new Set();logs.forEach(l=>l.entries.forEach(en=>{if(!before.has(en.ex))newEx.add(en.ex);}));
  const usesCrea=Object.keys(db.creatine).some(k=>k>=addDays(ws,-30));
  const wg=waterGoal(),waterDays=[0,1,2,3,4,5,6].filter(i=>(db.water[addDays(ws,i)]||0)>=wg).length;
  const sg=db.settings.skillGoal,sp=sg?skillPlan(sg.id):null;
  const pool=[
    {id:'pr',i:'trophy',n:'Hacé 1 récord personal',goal:1,cur:ev.filter(e=>e.k==='pr'||e.k==='up').length,p:30},
    {id:'weak',i:'muscle',n:'Hacé 10 series de '+weak.toLowerCase(),goal:10,cur:sets[weak]||0,p:30},
    {id:'mark',i:'bolt',n:'Cargá una marca',goal:1,cur:(db.tests||[]).filter(t=>inW(t.date)).length,p:20},
    {id:'new',i:'spark',n:'Probá un ejercicio nuevo',goal:1,cur:db.logs.length?newEx.size:0,p:20},
    {id:'water',i:'drop',n:'Llegá a tu meta de agua 4 días',goal:4,cur:waterDays,p:20}
  ];
  if(usesCrea)pool.push({id:'crea',i:'pill',n:'Tomá creatina 5 días',goal:5,cur:[0,1,2,3,4,5,6].filter(i=>db.creatine[addDays(ws,i)]).length,p:20});
  if(sp)pool.push({id:'skill',i:'acro',n:'Practicá '+shortN(sp.step.ex.n)+' 2 veces',goal:2,cur:logs.filter(l=>l.entries.some(en=>en.ex===sp.step.id)).length,p:30});
  /* la de días siempre está; las otras dos cambian cada semana */
  const r=hashStr(ws+(db.profile&&db.profile.nick||'')),pick=pool.map((x,k)=>({x,k:hashStr(r+':'+x.id)})).sort((a,b)=>a.k-b.k).slice(0,2).map(o=>o.x);
  return[{id:'days',i:'cal',n:'Entrená '+T+(T===1?' día':' días'),goal:T,cur:trainDays(ws,we),p:40}].concat(pick).map(m=>Object.assign(m,{done:m.cur>=m.goal,ws}));
}
/* cuando cumplís una misión: novedad + puntos de temporada (una sola vez por semana) */
function checkMissions(){
  if(!db.profile)return;
  const ms=missions(),ws=ms[0].ws,dn=db.settings.misDone||{};
  const got=dn[ws]||[];let fresh=[];
  ms.forEach(m=>{if(m.done&&!got.includes(m.id)){got.push(m.id);fresh.push(m);addEv({k:'mis',n:m.n,p:m.p});}});
  if(!fresh.length)return;
  Object.keys(dn).forEach(k=>{if(k<addDays(ws,-35))delete dn[k];});
  dn[ws]=got;db.settings.misDone=dn;save();
  setTimeout(()=>{toast('Misión cumplida: '+fresh[0].n+' (+'+fresh[0].p+' pts)');confetti(30);},700);
}
function missionsCard(){
  if(!db.profile)return '';
  const ms=missions(),left=7-((new Date().getDay()+6)%7),dn=ms.filter(m=>m.done).length;
  return '<div class="card mis"><div class="hd"><div><span class="lh-k">Misiones de la semana</span><h3>'+dn+' de '+ms.length+' cumplidas</h3><span class="mut sm-t">'+(left>1?'Se renuevan en '+left+' días':'Se renuevan mañana')+' · suman puntos a tu temporada</span></div></div>'+
   ms.map(m=>'<div class="mi'+(m.done?' done':'')+'"><span class="mi-ic">'+ic(m.done?'check':m.i,16)+'</span><span class="grow"><b>'+esc(m.n)+'</b><span class="bar"><i style="width:'+Math.round(Math.min(1,m.cur/m.goal)*100)+'%"></i></span></span><span class="mi-p">'+(m.done?'+'+m.p:Math.min(m.cur,m.goal)+'/'+m.goal)+'</span></div>').join('')+'</div>';
}

/* ============ Bloques de 4 semanas con descarga ============ */
/* rutinas armadas por la app: 4 semanas subiendo y la 5.ª de descarga (menos series, ~90 % del peso) */
function blockWeek(r){
  if(!r||!r.gen||r.skill||!r.since)return null;
  const w=Math.max(0,Math.floor((parseK(today())-parseK(r.since))/864e5/7));
  return{w:w%5,n:Math.floor(w/5)+1,deload:w%5===4};
}
const blockTxt=b=>b?(b.deload?'Semana de descarga':'Semana '+(b.w+1)+' de 4'+(b.w===3?' · la próxima es de descarga':'')):'';

/* ============ Importar desde Hevy o Strong (CSV) ============ */
function parseCSV(text){
  const first=text.split(/\r?\n/)[0]||'',del=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===del){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';if(row.length>1||row[0])rows.push(row);row=[];}
    else f+=c;}
  if(f||row.length){row.push(f);rows.push(row);}
  const head=(rows.shift()||[]).map(h=>h.trim().toLowerCase());
  return rows.map(r=>{const o={};head.forEach((h,k)=>o[h]=(r[k]||'').trim());return o;});
}
const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11,ene:0,abr:3,ago:7,dic:11};
function parseWhen(s){
  s=String(s||'').trim();let m;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2}))?/)))return new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0));
  if((m=s.match(/^(\d{1,2}) ([A-Za-z]{3})[a-z]* (\d{4}),? ?(\d{1,2})?:?(\d{2})?/))&&MON[m[2].toLowerCase()]!=null)return new Date(+m[3],MON[m[2].toLowerCase()],+m[1],+(m[4]||0),+(m[5]||0));
  const t=Date.parse(s);return isNaN(t)?null:new Date(t);
}
const dkOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
/* nombres en inglés de Hevy/Strong a los ejercicios de Swole */
function mapExName(raw){
  const n=normTxt(raw),has=(...w)=>w.every(x=>n.includes(x)),db_=/dumbbell/.test(n),cable=/cable/.test(n),mach=/machine|smith/.test(n);
  const id=
    has('incline','bench')?'incbench':has('bench press')&&db_?'dbpress':has('bench press')?'bench':
    has('front squat')?'frontsquat':has('bulgarian')?'bulgarian':has('leg press')?'legpress':has('squat')&&!db_&&!/goblet|split|jump|air|body/.test(n)?'squat':
    has('romanian')||has('rdl')||has('stiff')?'rdl':has('deadlift')?'deadlift':has('hip thrust')||has('glute bridge')?'hipthrust':
    (has('overhead press')||has('military'))&&!db_?'ohp':has('shoulder press')&&db_?'dbohp':has('shoulder press')?'ohp':
    has('lat pulldown')||has('pulldown')?'latpull':has('pull up')||has('pull-up')||has('pullup')||has('chin up')||has('chin-up')?'pullup':
    (has('row')&&(has('seated')||cable))?'cablerow':has('row')&&db_?'dbrow':has('row')&&has('inverted')?'austrow':has('row')&&!mach?'row':
    has('lateral raise')?'lateral':has('face pull')?'facepull':(has('pushdown')||has('push down'))?'pushdown':
    has('hammer curl')?'hammer':has('leg curl')||has('hamstring curl')?'legcurl':has('curl')&&db_?'dbcurl':has('curl')&&!/wrist/.test(n)?'curl':
    has('leg extension')?'legext':has('seated calf')?'seatedcalf':has('calf')?'calf':has('shrug')?'shrug':
    has('dip')&&!has('bench dip')?'dips':has('push up')||has('push-up')||has('pushup')?'pushup':has('plank')&&!has('side')?'plank':
    has('lunge')?'lunge':has('leg raise')?'legraise':has('russian twist')?'russian':has('farmer')?'farmer':null;
  return id&&exById(id)?id:null;
}
function guessMuscle(raw){
  const n=normTxt(raw);
  return /bench|chest|fly|pec/.test(n)?'pecho':/row|pull|lat|back/.test(n)?'dorsales':/curl/.test(n)&&!/leg/.test(n)?'biceps':/tricep|skull|extension/.test(n)&&!/leg/.test(n)?'triceps':
   /shoulder|lateral|raise|press/.test(n)?'hombros':/deadlift|hamstring|leg curl/.test(n)?'isquios':/calf/.test(n)?'gemelos':/glute|hip/.test(n)?'gluteos':
   /squat|leg|lunge|step/.test(n)?'cuadriceps':/ab|crunch|plank|core|sit/.test(n)?'abs':'pecho';
}
/* arma la vista previa a partir del archivo */
function csvPlan(text,lbs){
  const rows=parseCSV(text);if(!rows.length)return{err:'El archivo está vacío'};
  const k=Object.keys(rows[0]),hevy=k.includes('exercise_title'),strong=k.includes('exercise name');
  if(!hevy&&!strong)return{err:'No reconozco el archivo: tiene que ser el CSV que exportan Hevy o Strong'};
  const W={};
  rows.forEach(o=>{
    const when=parseWhen(hevy?o.start_time:o.date);if(!when)return;
    const name=hevy?o.title:o['workout name'],key=dkOf(when)+'|'+name+'|'+(hevy?o.start_time:o.date);
    const w=W[key]=W[key]||{date:dkOf(when),name:name||'Entreno importado',dur:0,ex:{},order:[]};
    if(hevy&&o.end_time){const e=parseWhen(o.end_time);if(e)w.dur=Math.max(1,Math.round((e-when)/60000));}
    if(strong&&o.duration){const h=/(\d+)\s*h/.exec(o.duration),mi=/(\d+)\s*m/.exec(o.duration);w.dur=(h?+h[1]*60:0)+(mi?+mi[1]:0)||(+o.duration>0?Math.round(+o.duration/60):0);}
    const exN=hevy?o.exercise_title:o['exercise name'];if(!exN)return;
    /* el cardio (cinta, bici, remo de máquina...) no se importa */
    const dist=parseFloat(hevy?o.distance_km:o.distance)||0;if(/treadmill|running|run|walk|cycling|bike|elliptical|stair|rowing machine|row (machine)|jump rope|swim/i.test(exN)||dist>0&&!(parseFloat(o.reps)>0))return;
    let kg=parseFloat(String(hevy?o.weight_kg:o.weight).replace(',','.'))||0;if(lbs&&!hevy)kg=Math.round(kg*0.4536*4)/4;
    const reps=parseFloat(hevy?o.reps:o.reps)||0,secs=parseFloat(hevy?o.duration_seconds:o.seconds)||0;
    if(!(reps>0)&&!(secs>0))return;
    const warm=hevy?/warm/i.test(o.set_type||''):/^w$/i.test(o['set order']||'');
    if(!w.ex[exN]){w.ex[exN]=[];w.order.push(exN);}
    w.ex[exN].push({kg,reps:reps>0?reps:secs,t:!(reps>0)&&secs>0,w:warm?1:0});
  });
  const ws=Object.values(W).filter(w=>w.order.length).sort((a,b)=>a.date<b.date?-1:1);
  const names=new Set();ws.forEach(w=>w.order.forEach(n=>names.add(n)));
  const map={},unknown=[];names.forEach(n=>{const id=mapExName(n);if(id)map[n]=id;else unknown.push(n);});
  const dup=ws.filter(w=>db.logs.some(l=>l.date===w.date&&l.name===w.name)).length;
  return{fmt:hevy?'Hevy':'Strong',ws,map,unknown,dup,sets:ws.reduce((s,w)=>s+w.order.reduce((a,n)=>a+w.ex[n].length,0),0)};
}
function csvImport(p){
  const made={},fresh=p.ws.filter(w=>!db.logs.some(l=>l.date===w.date&&l.name===w.name));
  p.unknown.forEach(n=>{
    if(!fresh.some(w=>w.ex[n]))return;
    const same=db.customEx.find(e=>normTxt(e.n)===normTxt(n.slice(0,40)));if(same){made[n]=same.id;return;}
    const sets=[].concat(...p.ws.map(w=>w.ex[n]||[])),time=sets.every(s=>s.t),bw=!time&&sets.every(s=>!s.kg),pm=guessMuscle(n);
    const ex={id:'c_'+uid(),n:n.slice(0,40),eq:'Personalizado',p:[pm],s:[],d:'Importado de '+p.fmt+'.',st:null,reg:LOWER.includes(pm)?'l':'u',custom:1};
    if(time)ex.time=1;else if(bw)ex.bw=1;db.customEx.push(ex);made[n]=ex.id;
  });
  let n=0;
  p.ws.forEach(w=>{
    if(db.logs.some(l=>l.date===w.date&&l.name===w.name))return;
    const entries=w.order.map(nm=>({ex:p.map[nm]||made[nm],sets:w.ex[nm].map(s=>{const o={kg:s.kg,reps:s.reps};if(s.w)o.w=1;return o;})})).filter(e=>e.ex&&e.sets.length);
    if(!entries.length)return;
    db.logs.push({id:uid(),date:w.date,name:w.name,routineId:null,dur:w.dur||60,entries,prs:[],imp:p.fmt});n++;
  });
  return n;
}

const Push=(()=>{
  const ok=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
  const ios=()=>/iPhone|iPad|iPod/.test(navigator.userAgent),standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  const b64=s=>{const p='='.repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)));};
  async function current(){if(!ok())return null;const r=await navigator.serviceWorker.getRegistration();return r?r.pushManager.getSubscription():null;}
  async function saveSub(sub){
    const st=db.settings.push||{},body={endpoint:sub.endpoint,sub:sub.toJSON(),tz:Intl.DateTimeFormat().resolvedOptions().timeZone||'America/Montevideo',at:st.at||'18:00',kinds:{train:st.train!==false,crea:!!st.crea},user_id:Sync.user().id};
    await Sync.req('/rest/v1/swole_push?on_conflict=endpoint',{method:'POST',auth:true,headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body});
  }
  async function enable(){
    if(!Sync.user())throw new Error('login');
    if(!ok())throw new Error(ios()&&!standalone()?'ios':'nosupport');
    const perm=await Notification.requestPermission();if(perm!=='granted')throw new Error('denied');
    const reg=await navigator.serviceWorker.ready;
    const key=await Sync.req('/rest/v1/rpc/swole_vapid_public',{method:'POST',body:{}});
    if(!key)throw new Error('nokey');
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(String(key))});
    db.settings.push=Object.assign({at:'18:00',train:true,crea:!!db.settings.remind.on},db.settings.push||{},{on:true});save();
    await saveSub(sub);
  }
  async function update(){const s=await current();if(s&&Sync.user())await saveSub(s);}
  async function disable(){
    const s=await current();
    if(s){try{if(Sync.user())await Sync.req('/rest/v1/swole_push?endpoint=eq.'+encodeURIComponent(s.endpoint),{method:'DELETE',auth:true});}catch(e){}await s.unsubscribe();}
    db.settings.push=Object.assign({},db.settings.push||{},{on:false});save();
  }
  async function test(){
    const t=await Sync.req('/functions/v1/swole-remind',{method:'POST',auth:true,body:{test:true}});
    return t;
  }
  const errTxt=e=>{const m=String(e&&e.message||e);return m==='login'?'Primero entrá con tu cuenta (Perfil → Cuenta)':m==='ios'?'En iPhone: agregá Swole a la pantalla de inicio (Compartir → Agregar a inicio) y activalo desde ahí':m==='nosupport'?'Este navegador no permite notificaciones':m==='denied'?'Bloqueaste las notificaciones: habilitalas en los ajustes del navegador para este sitio':'No se pudo: '+m;};
  return{ok,ios,standalone,enable,disable,update,test,current,errTxt};
})();

/* ============ Coach: lee tu historial y te dice qué ajustar ============ */
const PUSH_M=['pecho','hombros','triceps'],PULL_M=['dorsales','trapecio','biceps'];
function coachTips(){
  const out=[],t=today(),ws=weekStart(),hide=db.settings.coachHide||{};
  const logs=db.logs.slice().sort((a,b)=>a.date<b.date?-1:1);
  if(!db.profile||logs.length<2)return out;
  const last=logs[logs.length-1],gap=Math.round((parseK(t)-parseK(last.date))/864e5);
  /* 1. hace mucho que no entrenás */
  if(gap>=8)out.push({id:'gap',i:'play',tone:'warn',txt:'Hace '+gap+' días que no entrenás. Volvé con una sesión corta y liviana: lo importante es retomar.',a:'todayGo',al:'Entreno de hoy'});
  /* 2. estancado: 4+ sesiones en 6 semanas y las últimas 3 no superan a las anteriores */
  const from=addDays(t,-42),st=[];
  rankedList().forEach(x=>{
    if(x.ex.time)return;
    const ses=[];logs.filter(l=>l.date>=from).forEach(l=>{const en=l.entries.find(e=>e.ex===x.ex.id);if(!en)return;const m=Math.max(0,...en.sets.filter(s=>!s.w).map(s=>e1(x.ex,s.kg,s.reps)));if(m>0)ses.push({d:l.date,m});});
    if(ses.length<4)return;
    const rec=ses.slice(-3),old=ses.slice(0,-3),bestOld=Math.max(...old.map(s=>s.m)),bestRec=Math.max(...rec.map(s=>s.m));
    if(bestRec<=bestOld*1.005&&(parseK(rec[2].d)-parseK(rec[0].d))/864e5>=10)st.push(x.ex);
  });
  if(st.length)out.push({id:'stall-'+st[0].id,i:'swap',tone:'warn',txt:shortN(st[0].n)+' está estancado hace un par de semanas. Probá cambiar el estímulo: si venías en 8 repeticiones, hacé 3 semanas de 5 más pesadas (o al revés), o sumá una serie.',a:'exInfo',v:st[0].id,al:'Ver progreso'});
  /* 3. desbalance empuje / tirón (últimas 4 semanas) */
  let pu=0,pl=0,up=0,lo=0;
  logs.filter(l=>l.date>=addDays(t,-28)).forEach(l=>l.entries.forEach(en=>{const ex=exById(en.ex);if(!ex)return;const n=en.sets.filter(s=>!s.w).length,p=ex.p[0];
    if(PUSH_M.includes(p))pu+=n;if(PULL_M.includes(p))pl+=n;if(LOWER.includes(p))lo+=n;else if(!['abs','oblicuos'].includes(p))up+=n;}));
  if(pu>=12&&pu>pl*1.5)out.push({id:'pp',i:'swap',tone:'warn',txt:'Hacés '+num(pu/Math.max(1,pl),1)+' series de empuje por cada una de tirón. Sumá remos o dominadas: equilibra la postura y cuida los hombros.',a:'exInfo',v:'row',al:'Ver remo'});
  /* 4. piernas que quedan cortas */
  if(up>=20&&lo<up*.3&&!(db.profile.sports||[]).some(s=>['futbol','rugby','running','ciclismo','hockey','basquet'].includes(s)))
    out.push({id:'legs',i:'muscle',tone:'warn',txt:'Las piernas tienen '+Math.round(lo/(up+lo)*100)+' % de tus series. Sumá un día de piernas: son tus músculos más grandes y suben mucho tu rango general.',a:'genOpen',al:'Armar rutina'});
  /* 5. venís bien */
  const im=improvements();
  if(im.length&&out.length<3)out.push({id:'good',i:'trophy',tone:'ok',txt:'Venís subiendo: '+shortN(im[0].ex.n)+' +'+Math.round(im[0].rel*100)+' % en 4 semanas. Mantené lo que estás haciendo.'});
  /* 6. dormir y comer: si la racha semanal es buena pero no hay récords en 5 semanas */
  if(weekStreak()>=4&&!(db.settings.ev||[]).some(e=>(e.k==='pr'||e.k==='up')&&e.d>=addDays(t,-35))&&out.length<3)
    out.push({id:'plateau',i:'heart',tone:'warn',txt:'Entrenás seguido pero hace 5 semanas que no hay récords. Revisá sueño (7-9 h), proteína (1,6-2,2 g por kg) y probá una semana de descarga.'});
  return out.filter(x=>hide[x.id]!==ws).slice(0,3);
}
function coachCard(){
  const tips=coachTips();if(!tips.length)return '';
  return '<div class="card coach"><div class="hd"><div><span class="lh-k">Tu coach</span><h3>'+(tips.length===1?'Un consejo':tips.length+' consejos')+' para esta semana</h3></div>'+ic('spark',20)+'</div>'+

}

(()=>{const pts=new Map();let start=null,moved=false;
  const svg=()=>$('#rtSvg'),apply=()=>{const s=svg(),v=S.rt;if(s&&v){s.setAttribute('viewBox',(v.x-v.w/2)+' '+(v.y-v.w/2)+' '+v.w+' '+v.w);const k=s.querySelector('.rt-sky');if(k)k.setAttribute('transform','translate('+(v.x*.4).toFixed(1)+' '+(v.y*.4).toFixed(1)+')');}};
  const unit=()=>{const s=svg();return s?S.rt.w/s.getBoundingClientRect().width:1;};
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('#rtSvg'))return;S.rt=S.rt||{x:0,y:0,w:820};pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
    start={v:Object.assign({},S.rt),p:[...pts.values()].map(p=>({...p}))};},{passive:true});
  document.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId)||!start)return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});const P=[...pts.values()],u=start.v.w/(svg()?svg().getBoundingClientRect().width:1);
    if(P.length===1&&start.p.length===1){const dx=P[0].x-start.p[0].x,dy=P[0].y-start.p[0].y;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;S.rt.x=start.v.x-dx*u;S.rt.y=start.v.y-dy*u;}
    else if(P.length>=2&&start.p.length>=2){const d0=Math.hypot(start.p[0].x-start.p[1].x,start.p[0].y-start.p[1].y),d1=Math.hypot(P[0].x-P[1].x,P[0].y-P[1].y);if(d0>10){S.rt.w=clamp(start.v.w*d0/d1,320,1800);moved=true;}}
    else{start={v:Object.assign({},S.rt),p:P.map(p=>({...p}))};}
    apply();},{passive:true});
  const end=e=>{pts.delete(e.pointerId);if(!pts.size)start=null;else start={v:Object.assign({},S.rt),p:[...pts.values()].map(p=>({...p}))};};
  document.addEventListener('pointerup',end,{passive:true});document.addEventListener('pointercancel',end,{passive:true});
  /* si arrastraste, no cuenta como toque en un nodo */
  document.addEventListener('click',e=>{if(moved&&e.target.closest('#rtSvg')){e.stopPropagation();e.preventDefault();moved=false;}},true);
  document.addEventListener('wheel',e=>{if(!e.target.closest('#rtSvg'))return;e.preventDefault();S.rt=S.rt||{x:0,y:0,w:820};S.rt.w=clamp(S.rt.w*(e.deltaY>0?1.12:.89),320,1800);apply();},{passive:false});

})();

/* ============ Tiempo por sesión: cada rutina entra en el tiempo que tenés ============ */
const BIGMOV=['squat','bench','deadlift','ohp','row','frontsquat','incbench','rdl','hipthrust','legpress','pullup','dips','muscleup'];
function itemMin(it,rest){
  const ex=exById(it.ex);if(!ex)return 0;
  const big=BIGMOV.includes(ex.id)||it.main,work=ex.time?(+it.reps||30):(+it.reps||10)*3.2,rs=big?Math.max(rest,150):Math.min(rest,105);
  return ((+it.sets||3)*(work+rs)+(it.warm?it.warm*75:0)+40)/60;
}
const routineMinutes=r=>Math.round(6+(r.items||[]).reduce((s,it)=>s+itemMin(it,r.rest||90),0));
function fitTime(r,target){
  if(!target)return r;let g=0;
  while(routineMinutes(r)>target+4&&g++<40){
    const np=r.items.filter(it=>!it.prehab),acc=np.map((it,i)=>({it,i})).filter(x=>x.i>=2&&!x.it.main);
    const c=acc.filter(x=>x.it.sets>2).sort((a,b)=>b.it.sets-a.it.sets)[0];
    if(c)c.it.sets--;else if(r.items.length>3&&!r.items[r.items.length-1].main)r.items.pop();
    else{const m=r.items.find(it=>it.sets>3);if(m)m.sets--;else break;}
  }
  g=0;while(routineMinutes(r)<target-10&&g++<20){const c=r.items.filter(it=>!it.prehab).filter((it,i)=>i>=1&&!it.main&&it.sets<4).sort((a,b)=>a.sets-b.sets)[0];if(!c)break;c.sets++;}
  r.min=routineMinutes(r);return r;
}

  const p=db.profile||{},age=p.age||25,wk=weekGymDays(),act=[0,1,2,3,4,5,6].filter(x=>dayInfo(x).type);
  const all=wk.length?wk:genDays(+d.days||3,act),n=Math.max(2,Math.min(4,all.length));
  const days=all.slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).slice(0,n);
  const plan=PL_DAYS[n].map((lifts,i)=>{
    const items=[];
    lifts.forEach((id,j)=>items.push(j===0?{ex:id,sets:5,reps:5,pct:.75,main:1,warm:2}:{ex:id,sets:3,reps:6,pct:.7,sec:1}));
    (PL_ACC[lifts[0]]||[]).concat(lifts[1]?(PL_ACC[lifts[1]]||[]).slice(0,1):[]).filter(x=>exById(x)&&!items.some(it=>it.ex===x)).slice(0,3)

/* al empezar una rutina de powerlifting: series, reps y kilos de la semana del bloque */
function plApply(r,act){
  const w=plWeek(r),teen=(db.profile&&db.profile.age||25)<18,M=(teen?PL_MAIN_TEEN:PL_MAIN)[w],SC=PL_SEC[w];
  act.name=r.name+' · semana '+(w+1)+(w===4?' (liviana)':'');
  act.entries.forEach((en,k)=>{const it=r.items[k];if(!it||it.ex!==en.ex||!(it.main||it.sec))return;
    const [s,rp,pct]=it.main?M:SC,b=bestE1(it.ex),kg=b?Math.round(b.e*pct/2.5)*2.5:0;
    const warm=en.sets.filter(x=>x.w);en.sets=warm.map((x,i)=>({kg:kg?Math.round(kg*(i?.7:.5)/2.5)*2.5:'',reps:i?3:5,done:false,w:1}));
    for(let i=0;i<s;i++)en.sets.push({kg:kg||'',reps:rp,done:false});
    en.goal=kg?{kg,reps:rp,prev:Math.round(pct*100)+' %',why:Math.round(pct*100)+' % de tu máximo'}:null;
    if(!kg)en.note='Todavía no tengo tu máximo: hacé una serie pesada de 3-5 y cargala como marca';
  });
}

/* ============ Articulaciones de acero ============
   Lo que respalda la evidencia (resumen):
   - Tendón: isométricos (sostener 30-45 s) calman el dolor a corto plazo; la carga lenta y pesada y los excéntricos lo fortalecen a largo plazo.
   - Cartílago: cargarlo de forma progresiva no lo daña; lo que importa es subir de a poco.
   - Isquios: el curl nórdico baja las lesiones a la mitad o menos. Ingle: el Copenhague bajó 41 % los problemas en futbolistas.
   - Tobillo: el equilibrio a una pierna baja ~35 % los esguinces (sobre todo si ya tuviste uno).
   - Hombro: fortalecer la rotación externa. Espalda baja: resistencia del tronco (evidencia más débil: mantenimiento). */

  {k:'ing',n:'Ingle',i:'acro',m:['aductores'],tests:[['copenhagen',30,'s']],ex:[['copenhagen',3,20]],tip:'El Copenhague previene la pubalgia.'},
  {k:'esp',n:'Espalda baja',i:'body',m:['lumbar','abs','oblicuos'],tests:[['sidepl',90,'s'],['biering',120,'s']],ex:[['sidepl',3,30],['birddog',2,8],['curlup',2,8]],tip:'Un tronco resistente sostiene la espalda.'},

/* Meta de hoy (sobrecarga progresiva): mira la última vez y propone un poquito más. */
function goalFor(id){
  const ex=exById(id),ls=(lastSets(id)||[]).filter(s=>!s.w&&+s.reps>0);
  if(!ex||!ls.length)return null;
  if(ex.time){const best=Math.max(...ls.map(s=>+s.reps));return{kg:0,reps:best+5,prev:best+' s',why:'+5 segundos'};}
  const top=ls.reduce((a,s)=>e1(ex,s.kg,s.reps)>e1(ex,a.kg,a.reps)?s:a,ls[0]);
  const prev=(+top.kg?num(+top.kg,1)+' kg × ':'')+top.reps;
  if(ex.sk||ex.bw&&!+top.kg)return{kg:+top.kg||0,reps:+top.reps+1,prev,why:'+1 repetición'};
  const allHit=ls.every(s=>+s.reps>=+top.reps);
  if(!allHit)return{kg:+top.kg,reps:+top.reps,prev,why:'completá todas las series con este peso'};
  const kg=+top.kg,low=LOWER.includes(ex.p[0]);
  let inc=ex.ph?(kg>=12?2:1):low?(kg>=60?5:2.5):(kg>=20?2.5:1);
  /* si la última vez te sobraban 3 o más, el salto es doble; si llegaste al fallo, se mantiene el peso */
  const rr=ls.filter(s=>s.rir!=null).map(s=>+s.rir);
  if(rr.length&&Math.min(...rr)>=3)return{kg:Math.round((kg+inc*2)*4)/4,reps:+top.reps,prev,why:'+'+num(inc*2,2)+' kg (te sobraba)'};
  if(rr.length&&Math.max(...rr)===0)return{kg,reps:+top.reps+1,prev,why:'+1 repetición (llegaste al fallo)'};
  return{kg:Math.round((kg+inc)*4)/4,reps:+top.reps,prev,why:'+'+num(inc,2)+' kg'};
}
const goalTxt=(ex,g)=>ex.time?g.reps+' s':(g.kg?num(g.kg,2)+' kg × ':'')+g.reps+(ex.time?'':' reps');
const hitGoal=(g,s)=>g&&+s.reps>=g.reps&&(+s.kg||0)>=g.kg-1e-9;
/* descanso propio: los básicos piden más */
const BIG=['squat','bench','deadlift','ohp','row','frontsquat','incbench','rdl','hipthrust','legpress','pullup','dips','muscleup'];
const restFor=ex=>ex&&(BIG.includes(ex.id)||ex.st&&isBarbell(ex))?Math.max(db.settings.rest,150):db.settings.rest;
/* "más fuerte que el X %": estimación a partir del nivel (tablas de referencia de gente que entrena) */
function pctStronger(ex,e){
  if(!ex||!ex.st||!db.profile)return null;
  const v=levelVal(ex,e);
  if(v<0){const s=stdFor(ex);return Math.max(1,Math.round(5*e/s.lo));}
  const T=[[0,5],[3,25],[6,50],[9,68],[12,80],[15,90],[18,97]];
  for(let i=1;i<T.length;i++)if(v<=T[i][0]){const a=T[i-1],b=T[i];return Math.round(a[1]+(b[1]-a[1])*(v-a[0])/(b[0]-a[0]));}
  return 97;
}

const monday=dk=>{const d=parseK(dk);return addDays(dk,-((d.getDay()+6)%7));};
function recapData(){
  const from=addDays(monday(today()),-7),to=addDays(from,6);
  const logs=db.logs.filter(l=>l.date>=from&&l.date<=to),m={},bw=weightNow()||70;
  let sets=0,vol=0,min=0;const prs=[];
  logs.forEach(l=>{min+=+l.dur||0;(l.prs||[]).forEach(id=>{const ex=exById(id);if(ex&&!prs.includes(ex))prs.push(ex);});
    l.entries.forEach(en=>{const ex=exById(en.ex);if(!ex)return;en.sets.forEach(s=>{if(s.w)return;sets++;if(!ex.time)vol+=((ex.bw||0)*bw+(+s.kg||0))*(+s.reps||0);ex.p.forEach(k=>m[k]=(m[k]||0)+1);ex.s.forEach(k=>m[k]=(m[k]||0)+.5);});});});
  const top=Object.keys(m).sort((a,b)=>m[b]-m[a])[0];

  return{from,to,key:from,n:logs.length,sets,vol,min,prs,m,top,ach};
}

/* ============ Objetivos ============ */
/* un objetivo = llegar a un nivel en un ejercicio. El progreso va desde dónde estabas al fijarlo hasta la meta. */
const curV=ex=>{const b=bestE1(ex.id);return b?Math.max(-1,levelVal(ex,b.e)):-1;};
function goalProg(g){const ex=exById(g.ex);if(!ex)return null;const v=curV(ex),v0=Math.min(g.v0,g.L-.01);return{ex,v,pct:clamp((v-v0)/(g.L-v0),0,1)};}
function goalSuggest(){
  const have=new Set((db.goals||[]).filter(g=>!g.done).map(g=>g.ex)),out=[];
  /* el próximo nivel de tus mejores ejercicios y del grupo más flojo */
  const r=rankedList().filter(x=>x.info.L>=0&&x.info.L<18&&!have.has(x.ex.id));
  const gl=groupLevels(),weak=Object.keys(gl).filter(g=>gl[g]).sort((a,b)=>gl[a].v-gl[b].v)[0];
  if(weak){const x=r.find(y=>groupOf(y.ex)===weak);if(x)out.push({ex:x.ex,L:x.info.L+1,why:'Tu grupo más flojo: '+weak.toLowerCase()});}
  r.forEach(x=>{if(out.length<3&&!out.some(o=>o.ex.id===x.ex.id))out.push({ex:x.ex,L:x.info.L+1,why:'Estás a '+Math.round((1-x.info.pct)*100)+' % del próximo rango'});});
  return out;
}
function goalRow(g){
  const p=goalProg(g);if(!p)return '';
  return '<div class="goal-row'+(g.done?' done':'')+'">'+badge(g.L,40)+'<div class="grow"><b>'+esc(p.ex.n)+'</b> → '+lvlSpan(g.L)+
   '<div class="bar" style="margin:6px 0 4px"><i style="width:'+Math.round((g.done?1:p.pct)*100)+'%;background:'+lvlColor(g.L)+'"></i></div>'+
   '<span class="mut sm-t">'+(g.done?'¡Cumplido el '+esc(shortDate(parseK(g.done).getTime()))+'!':'Te falta: '+needTxt(p.ex,g.L))+'</span></div>'+
   '<button class="ib flat" data-a="goalDel" data-v="'+g.id+'" aria-label="Quitar objetivo">'+ic('x',16)+'</button></div>';
}
function goalsCard(home){
  const act=(db.goals||[]).filter(g=>!g.done),done=(db.goals||[]).filter(g=>g.done).slice(-3).reverse();
  if(home&&!act.length)return '';
  let h='<div class="card"><div class="hd"><div><h3>Tus objetivos</h3><span class="mut sm-t">'+(act.length?'Hasta 3 a la vez':'Elegí qué rango querés alcanzar')+'</span></div><span class="tag">'+act.length+'/3</span></div><div class="gap">'+act.map(goalRow).join('')+'</div>';
  if(!home){
    const sug=act.length<3?goalSuggest():[];
    if(sug.length)h+='<p class="mut sm-t" style="margin:12px 0 6px;font-weight:700">Sugeridos para vos</p><div class="gap">'+sug.map(s=>'<div class="row goal-sug">'+badge(s.L,34)+'<div class="grow"><b>'+esc(s.ex.n)+'</b> → '+lvlSpan(s.L)+'<br><span class="mut sm-t">'+esc(s.why)+' · '+needTxt(s.ex,s.L)+'</span></div><button class="btn sm" data-a="goalAdd" data-v="'+s.ex.id+'" data-l="'+s.L+'">'+ic('plus',14)+' Fijar</button></div>').join('')+'</div>';
    else if(!act.length)h+='<p class="mut sm-t" style="margin-top:8px">Cargá alguna marca y te sugiero objetivos.</p>';
    if(done.length)h+='<p class="mut sm-t" style="margin:12px 0 6px;font-weight:700">Cumplidos</p><div class="gap">'+done.map(goalRow).join('')+'</div>';

}

function mkEntry(id,n,reps,warm){
  const ls=(lastSets(id)||[]).filter(s=>!s.w),sets=[];
  /* series de calentamiento: ~50% y ~70% del peso de trabajo, no cuentan para el volumen */
  if(warm){const l0=ls[0]&&+ls[0].kg;[[.5,10],[.7,5]].slice(0,warm).forEach(x=>sets.push({kg:l0?Math.max(0,Math.round(l0*x[0]/2.5)*2.5):'',reps:x[1],done:false,w:1}));}
  for(let i=0;i<n;i++){const l=ls.length?(ls[i]||ls[ls.length-1]):null;sets.push({kg:l&&l.kg?l.kg:'',reps:reps,done:false});}
  return{ex:id,sets,note:''};
}
function startSession(rid,dk,adhoc){
  if(db.active){S.sessOpen=true;render();toast('Ya tenés un entrenamiento en curso');return;}
  if(dk&&dk>today()){toast('No podés registrar un entrenamiento en un día que todavía no llegó');return;}
  const r=adhoc||(rid?db.routines.find(x=>x.id===rid):null);
  /* rutina de habilidad: se recalcula con tu progreso de hoy */
  if(r&&r.skill&&!adhoc){const sp=skillPlan(r.skill);if(sp)r.items=sp.items;}
  if(r&&r.rest)db.settings.rest=r.rest;
  const bw=adhoc||(r&&r.pl)?null:blockWeek(r);
  const its=(r?r.items:[]).map(it=>bw&&bw.deload?Object.assign({},it,{sets:Math.max(2,Math.round(it.sets*.6))}):it);
  db.active={id:uid(),date:dk||today(),routineId:r&&!adhoc?r.id:null,name:r?r.name+(bw&&bw.deload?' · descarga':''):'Entrenamiento libre',t0:Date.now(),note:'',entries:its.map(it=>mkEntry(it.ex,it.sets,it.reps,it.warm))};
  if(r&&r.pl&&!adhoc)plApply(r,db.active);
  /* semana de descarga: ~90 % del peso y sin meta de subir */
  if(bw&&bw.deload){db.active.deload=1;db.active.entries.forEach(en=>{en.goal=null;en.sets.forEach(s=>{if(+s.kg)s.kg=Math.round(+s.kg*.9/2.5)*2.5;});});setTimeout(()=>toast('Semana de descarga: menos series y un poco menos de peso para recuperar'),400);}
  save();S.sessOpen=true;render();
}

function finishSession(){
  const a=db.active;
  const entries=a.entries.map(en=>{const o={ex:en.ex,sets:en.sets.filter(s=>s.done&&(+s.reps)>0).map(s=>{const r={kg:+s.kg||0,reps:+s.reps};if(s.w)r.w=1;if(s.rir!=null)r.rir=s.rir;return r;})};if((en.note||'').trim())o.note=en.note.trim();return o;}).filter(en=>en.sets.length);
  if(!entries.length){toast('Marcá al menos una serie como hecha');return;}
  const before={};
  entries.forEach(en=>{const ex=exById(en.ex),b=bestE1(en.ex);before[en.ex]={e:b?b.e:0,L:hasRank(ex)?(b?levelIdx(ex,b.e):-1):null};});
  const log={id:a.id,date:a.date,name:a.name,routineId:a.routineId,dur:Math.max(1,Math.round((Date.now()-a.t0)/60000)),entries,prs:[]};
  if((a.note||'').trim())log.note=a.note.trim();
  db.logs.push(log);
  const prs=[],ups=[];
  entries.forEach(en=>{
    const ex=exById(en.ex),b=bestE1(en.ex),bf=before[en.ex];
    if(!ex||!b)return;
    if(bf.e>0&&b.e>bf.e+.01){prs.push({ex:ex.id,e:b.e});log.prs.push(ex.id);}
    if(hasRank(ex)&&bf.L!=null){const L=levelIdx(ex,b.e);if(L>bf.L&&L>=0)ups.push({ex:ex.id,from:bf.L,to:L});}
  });
  let vol=0,sets=0;
  /* en ejercicios con peso corporal (dominadas, fondos...) también cuenta la parte del cuerpo que movés; el calentamiento no suma */
  const bwKg=weightNow()||70;
  entries.forEach(en=>{const ex=exById(en.ex);en.sets.forEach(s=>{if(s.w)return;sets++;if(ex&&!ex.time)vol+=((ex.bw||0)*bwKg+s.kg)*s.reps;});});
  const gTot=a.entries.filter(en=>en.goal).length,gHit=a.entries.filter(en=>en.hit).length;
  addEv({k:'w',n:log.name,d:log.date});prs.forEach(p=>addEv({k:'pr',x:p.ex,d:log.date}));ups.forEach(u=>addEv({k:'up',x:u.ex,L:u.to,d:log.date}));
  db.active=null;save();endRest(false);S.sessOpen=false;
  S.modal={t:'summary',log,prs,ups,vol,sets,goals:{hit:gHit,tot:gTot}};render();
  checkGoals();checkRankUp(900);checkMissions();
  if(ups.length||prs.length)setTimeout(()=>confetti(ups.length?70:36),250);
  checkAch();
}
/* calculadora de discos: cuántos discos por lado para llegar al peso */
const PLATES=[25,20,15,10,5,2.5,1.25];
const PCOL={25:'#D6334F',20:'#2F73E0',15:'#E0B000',10:'#17935C',5:'#EEF0FF',2.5:'#14172B',1.25:'#8794AC'};
function platesFor(total,bar){
  let side=(total-bar)/2;const out=[];
  if(side<0)return null;
  PLATES.forEach(p=>{while(side>=p-1e-9){out.push(p);side=Math.round((side-p)*100)/100;}});
  return{plates:out,left:side*2};
}

function beep(){
  try{if(audioCtx){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=880;const n=audioCtx.currentTime;g.gain.setValueAtTime(.001,n);g.gain.exponentialRampToValueAtTime(.3,n+.03);g.gain.exponentialRampToValueAtTime(.001,n+.6);o.start();o.stop(n+.65);}}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,80,200]);}catch(e){}
}
function startRest(sec){S.rest={end:Date.now()+sec*1000,total:sec};clearInterval(restT);restT=setInterval(restTick,250);renderRest();}
function restTick(){

  const b=$('#restT'),f=$('#restF'),w=$('.restb');

function exDetail(id){
  const ex=exById(id);if(!ex)return '';
  let h=techCard(ex)+'<div class="big-map" style="max-width:300px;width:100%">'+bodyMap(mapOf(ex),{labels:1,cls:'live'})+'</div><div class="chips">'+chipsMus(ex)+'</div>';
  if(ex.d)h+='<p>'+esc(ex.d)+'</p>';
  if(ex.ph)h+='<div class="warn"><b>Peso por mano:</b> anotá lo que pesa UNA mancuerna, no la suma de las dos.</div>';
  h+='<p class="mut sm-t">Equipo: '+esc(ex.eq)+'. Los músculos resaltados son los principales y los claros, los secundarios.</p>';
  h+='<div class="row" style="gap:8px;flex-wrap:wrap">'+(hasRank(ex)?'<button class="btn sm pri" data-a="markOpen" data-v="'+ex.id+'">'+ic('bolt',16)+' Cargar marca</button>':'')+(isBarbell(ex)?'<button class="btn sm line" data-a="platesOpen">'+ic('disc',16)+' Calculadora de discos</button>':'')+'</div>';
  const b=bestE1(id);
  if(hasRank(ex)&&db.profile){
    const cur=curV(ex),nextL=Math.max(0,Math.min(18,Math.floor(cur)+1)),has=(db.goals||[]).find(g=>g.ex===id&&!g.done);
    if(cur<18)h+=has?'<div class="goal hit" style="border-style:dashed"><span class="grow"><span class="mut sm-t">Tu objetivo</span><br><b>'+lvlName(has.L)+'</b></span>'+ic('flag',20)+'</div>'
      :'<div class="goal"><span class="grow"><span class="mut sm-t">Próximo objetivo</span><br><b>'+lvlName(nextL)+'</b> <span class="mut sm-t">· '+needTxt(ex,nextL)+'</span></span><button class="btn sm" data-a="goalAdd" data-v="'+id+'" data-l="'+nextL+'">'+ic('flag',14)+' Fijar</button></div>';
    if(b){
      const i=lvlInfo(ex,b.e);
      h+='<div class="card" style="margin:0"><div class="row">'+badge(i.L,60)+'<div class="grow"><div style="font:800 24px var(--f-d)">'+lvlSpan(i.L)+'</div><span class="mut sm-t">Mejor serie: '+(b.kg?num(b.kg,1)+' kg × ':'')+b.reps+(ex.time?' s':'')+' · '+bestTxt(ex,b)+'</span></div></div>'+pctTxt(pctStronger(ex,b.e))+
       (i.next!=null?'<div class="bar" style="margin:12px 0 6px"><i style="width:'+Math.round(clamp(i.pct,0,1)*100)+'%;background:'+lvlColor(i.L)+'"></i></div><span class="sm-t mut">Para '+lvlName(i.next||0)+': '+needTxt(ex,i.next||0)+'</span>':'')+(ex.st?'<p class="sm-t" style="margin-top:8px">'+pctLine(pctStronger(ex,b.e))+' <span class="mut">de '+whoTxt()+' (estimado)</span></p>':'')+'</div>';
    }else h+='<div class="warn">Todavía no registraste este ejercicio. '+(ex.sk?'Con '+needTxt(ex,ex.sk.b)+' ya entrás en '+lvlName(ex.sk.b)+'.':'Para llegar a Bronce 1 necesitás un 1RM estimado de '+num(stdFor(ex).lo,1)+' kg.')+'</div>';
    if(ex.sk){
      /* la escalera de la progresión */
      h+='<div><h4 style="margin-bottom:8px">Progresión: '+esc(SKFAM[ex.sk.f])+'</h4><div class="gap">'+skFam(ex.sk.f).map(v=>{
        const bb=bestE1(v.id),L=bb?levelIdx(v,bb.e):null;
        return '<button class="row" style="text-align:left;padding:8px 10px;border-radius:12px;background:'+(v.id===id?'var(--raise)':'transparent')+'" data-a="exInfo" data-v="'+v.id+'"><span class="lvl-t" style="color:'+lvlColor(v.sk.b)+';min-width:82px;font-size:13px">'+lvlName(v.sk.b)+'</span><span class="grow">'+esc(v.n)+'</span>'+(bb?'<span style="color:var(--ok)">'+ic('check',18)+'</span>':'')+'</button>';
      }).join('')+'</div></div>';
    }else h+='<div><h4 style="margin-bottom:8px">1RM estimado para cada rango (según tu perfil)</h4><div class="ladder">'+TIERS.map((t,k)=>'<div style="color:'+TCOL[k]+'">'+t+'<b>'+Math.round(thr(ex,k===6?18:k*3))+'</b></div>').join('')+'</div></div>';
  }else if(!hasRank(ex))h+='<p class="mut sm-t">Este ejercicio no tiene escala de rangos, pero igual podés registrarlo y ver su progreso.</p>';
  const pts=e1Points(id);
  if(hasRank(ex)||ex.time)h+='<div><h4 style="margin-bottom:8px">Progreso ('+(ex.sk||ex.time?'mejor serie':'1RM estimado')+')</h4>'+chart(pts,ex.sk||ex.time?(ex.time?'segundos':'repeticiones'):'kg')+'</div>';
  /* historial: todas las veces que lo hiciste */
  const hist=allSess().filter(l=>l.entries.some(en=>en.ex===id)).sort((a,b)=>a.date<b.date?1:-1);
  if(hist.length)h+='<div><h4 style="margin-bottom:6px">Historial ('+hist.length+(hist.length===1?' vez':' veces')+')</h4><div class="hist">'+hist.slice(0,30).map(l=>{const en=l.entries.find(x=>x.ex===id);
    return '<div class="rowline"><span><b>'+shortDate(parseK(l.date).getTime())+'</b>'+(l.test?' <span class="tag" style="color:var(--acc)">Marca</span> <button class="ib flat" style="width:28px;height:28px;display:inline-grid;vertical-align:middle" data-a="delTest" data-v="'+l.id+'" aria-label="Borrar marca">'+ic('trash',14)+'</button>':'')+(en.note?'<br><span class="mut sm-t">'+esc(en.note)+'</span>':'')+'</span><span class="mut" style="text-align:right">'+en.sets.map(s=>setTxt(ex,s)).join(', ')+'</span></div>';}).join('')+'</div></div>';
  if(ex.custom&&!ex.hidden)h+='<button class="btn bad wide" data-a="delEx" data-v="'+id+'">Eliminar ejercicio</button>';
  return h;
}

function agoTxt(t){if(!t)return '';const s=Math.round((Date.now()-t)/1000);if(s<60)return 'recién';if(s<3600)return 'hace '+Math.round(s/60)+' min';if(s<86400)return 'hace '+Math.round(s/3600)+' h';return 'el '+shortDate(t);}

  const L=levelIdx(ex,e),b=bestE1(ex.id),bl=b?levelIdx(ex,b.e):null;

/* Cada ventana abierta suma una entrada al historial: el botón atrás de Android la cierra en vez de salir de la app. */
let hDepth=0,ignorePop=0,layerQ=false,wakeLock=null;
const openLayers=()=>(S.sessOpen&&db.active?1:0)+(S.modal?1:0)+(S.picker?1:0)+(S.m2?1:0);
function syncLayers(){if(layerQ)return;layerQ=true;queueMicrotask(()=>{layerQ=false;
  const d=openLayers();
  while(hDepth<d){try{history.pushState({sw:hDepth+1},'');}catch(e){}hDepth++;}
  if(hDepth>d){hDepth=d;ignorePop++;try{history.back();}catch(e){ignorePop--;}}
  lockScroll(d>0);
  keepAwake(!!db.active);
});}
window.addEventListener('popstate',()=>{
  if(ignorePop>0){ignorePop--;return;}
  hDepth=Math.max(0,hDepth-1);

  if(S.m2)S.m2=null;
  else if(S.picker)S.picker=null;
  else if(S.modal){if((S.modal.t==='profile'&&!db.profile)||S.modal.t==='welcome'||S.modal.t==='onb'){try{history.pushState({sw:hDepth+1},'');hDepth++;}catch(e){}return;}S.modal=null;}
  else if(S.sessOpen)S.sessOpen=false;
  render();
});
function lockScroll(on){
  const r=document.documentElement,b=document.body,isOn=r.classList.contains('locked');
  /* en compu alcanza con ocultar el desborde (la barra reserva su lugar); el truco de fijar el body es solo para celulares */
  const fine=matchMedia('(hover:hover) and (pointer:fine)').matches;
  if(on&&!isOn){S.lockY=window.scrollY;if(!fine)Object.assign(b.style,{position:'fixed',top:(-S.lockY)+'px',left:'0',right:'0',width:'100%'});r.classList.add('locked');}
  else if(!on&&isOn){r.classList.remove('locked');if(b.style.position==='fixed'){Object.assign(b.style,{position:'',top:'',left:'',right:'',width:''});window.scrollTo(0,S.lockY||0);}}

async function keepAwake(on){

    if(on&&!wakeLock&&'wakeLock' in navigator&&document.visibilityState==='visible'){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}
    else if(!on&&wakeLock){const w=wakeLock;wakeLock=null;await w.release();}
  }catch(e){wakeLock=null;}
}

document.addEventListener('input',e=>{
  const el=e.target,i=el.dataset&&el.dataset.i;
  if(!i)return;
  const f=el.dataset.f;
  if(i==='q'){S.q=el.value;const r=$('#exres');if(r)r.innerHTML=exResults();}
  else if(i==='pq'){S.picker.q=el.value;const r=$('#pres');if(r)r.innerHTML=pickResults();}
  else if(i==='set'){const s=db.active.entries[+el.dataset.e].sets[+el.dataset.s];s[f]=el.value===''?'':+el.value;save();}
  else if(i==='d'){
    if(el.closest('#view')){pfD()[f]=el.value;return;}
    const m=el.closest('#modal2')?S.m2:S.modal;
    m.d[f]=el.value;
    if(m.t==='excreate'&&f==='p'){m.d.s=m.d.s.filter(k=>k!==el.value);renderModal();}
  }
  else if(i==='item'){S.modal.d.items[+el.dataset.e][f]=el.value;}
  else if(i==='lset'){S.modal.d.entries[+el.dataset.e].sets[+el.dataset.s][f]=el.value;}
  else if(i==='genRep'){S.m2.d.replace=el.checked;}
  else if(i==='tool'){S.modal[f]=el.value;if(S.modal.tab==='rm'){const o=$('#rmOut'),kg=+S.modal.kg||0,rp=Math.min(15,+S.modal.reps||0);if(o)o.innerHTML=rmOut(kg>0&&rp>0?kg*(1+rp/30):0);}}
  else if(i==='csv'){const file=el.files&&el.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{S.m2.csvText=String(rd.result);S.m2.csv=csvPlan(S.m2.csvText,false);renderModal();};rd.readAsText(file);}
  else if(i==='csvLbs'){S.m2.csv=csvPlan(S.m2.csvText||'',el.checked);S.m2.csv.lbs=el.checked;renderModal();}
  else if(i==='cmdq'){S.modal.q=el.value;S.modal.i=0;const l=$('#cmdList');if(l)l.innerHTML=cmdList(S.modal);}
  else if(i==='phX'){S.modal.x=+el.value;const c=el.closest('.cmp');if(c)c.style.setProperty('--x',el.value+'%');}
  else if(i==='phSel'){S.modal[f]=el.value;renderModal();}
  else if(i==='photoAdd'){const file=el.files&&el.files[0];el.value='';if(!file)return;
    shrinkPhoto(file).then(blob=>PhotoDB.put({id:uid(),date:today(),t:Date.now(),blob})).then(()=>{loadPhotos();toast('Foto guardada en este dispositivo');}).catch(()=>toast('No se pudo guardar la foto'));}
  else if(i==='mq'){S.m2.d.q=el.value;const l=$('#markList');if(l)l.innerHTML=markList(S.m2.d);}
  else if(i==='mk'){S.m2.d[f]=el.value;const p=$('#markPrev');if(p)p.innerHTML=markPrev(S.m2.d);}
  else if(i==='onb'){S.modal.d[f]=el.value;}
  else if(i==='enote'){db.active.entries[+el.dataset.e].note=el.value;save();}
  else if(i==='anote'){db.active.note=el.value;save();}
  else if(i==='pl'){S.m2.d[f]=el.value;const o=document.createElement('div');o.innerHTML=platesHTML(S.m2.d);const n=o.querySelector('#plOut'),c=$('#plOut');if(n&&c)c.replaceWith(n);const b=$('#modal2 [data-a="platesUse"]'),nb=o.querySelector('[data-a="platesUse"]');if(b&&nb)b.replaceWith(nb);}
  else if(i==='file'){
    const file=el.files&&el.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=()=>{const t=$('#impTxt');if(t)t.value=String(r.result);};
    r.readAsText(file);
  }
});

  if(S.modal&&S.modal.t==='cmd'&&!S.m2){
    if(e.key==='ArrowDown'){e.preventDefault();cmdMove(1);return;}
    if(e.key==='ArrowUp'){e.preventDefault();cmdMove(-1);return;}
    if(e.key==='Enter'){e.preventDefault();cmdRun(S.modal.i||0);return;}
  }
  if(e.key==='Enter'&&S.m2&&S.m2.t==='login'&&e.target.tagName==='INPUT'){e.preventDefault();Sync.loginGo();return;}
  if(e.key!=='Escape')return;
  if(S.m2)closeLayer('m2');
  else if(S.picker){S.picker=null;renderPicker();}
  else if(S.modal)closeLayer('modal');
});

/* ============ Sincronización con Supabase ============ */
function mergeDb(L,R){
  const cl={},dl={},clone=x=>x==null?x:JSON.parse(JSON.stringify(x));
  [L.clock,R.clock].forEach(o=>{for(const k in o)cl[k]=Math.max(cl[k]||0,+o[k]||0);});
  [L.del,R.del].forEach(o=>{for(const k in o)dl[k]=Math.max(dl[k]||0,+o[k]||0);});
  /* elige entre la versión local (a) y la remota (b) de una clave */
  const pick=(k,a,b)=>{
    const ta=a!==undefined?(L.clock[k]||0):-1,tb=b!==undefined?(R.clock[k]||0):-1;
    const v=tb>ta?b:(a!==undefined?a:b),t=Math.max(ta,tb),d=dl[k]||0;
    return d&&d>=t?undefined:clone(v);
  };
  const out=normalize(clone(L));
  for(const c in SYNC_COLL){
    const key=SYNC_COLL[c],la=new Map(),ra=new Map();
    (L[c]||[]).forEach(x=>la.set(String(x[key]),x));(R[c]||[]).forEach(x=>ra.set(String(x[key]),x));
    const ids=[...la.keys()];ra.forEach((_,id)=>{if(!la.has(id))ids.push(id);});
    out[c]=ids.map(id=>pick(c+':'+id,la.get(id),ra.get(id))).filter(x=>x!==undefined);
  }
  SYNC_MAP.forEach(c=>{
    const m={},ks=new Set(Object.keys(L[c]||{}).concat(Object.keys(R[c]||{})));
    ks.forEach(k=>{const v=pick(c+':'+k,(L[c]||{})[k],(R[c]||{})[k]);if(v!==undefined)m[k]=v;});
    out[c]=m;
  });
  const empty=v=>v==null||(typeof v==='object'&&!Object.keys(v).length);
  SYNC_ONE.forEach(c=>{
    const lt=L.clock[c]||0,rt=R.clock[c]||0;
    /* empate (datos de antes de sincronizar): gana la nube, salvo que esté vacía */
    out[c]=clone(rt>lt||(rt===lt&&!empty(R[c]))?R[c]:L[c]);
  });
  out.settings=normalize({settings:out.settings}).settings;
  /* los borrados de hace más de un año ya no hacen falta */
  const old=Date.now()-365*864e5;for(const k in dl)if(dl[k]<old)delete dl[k];
  out.clock=cl;out.del=dl;out.active=L.active;
  return out;
}
