<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Swole</title>
<meta name="description" content="Registrá tus entrenamientos, mirá tu nivel de fuerza y controlá nutrición, agua y creatina.">
<meta name="theme-color" content="#F3F4FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1020" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Swole">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4FA;--surf:#FFFFFF;--raise:#E9ECF7;--line:#D9DDEE;--text:#14172B;--mut:#5F6588;
  --acc:#5B43F0;--acc-ink:#FFFFFF;--hot:#E8337A;--body:#D5D9EC;--muscle:#BCC1DD;
  --ok:#17935C;--bad:#D6334F;--shadow:0 10px 30px rgba(20,23,43,.10);
  --f-d:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-b:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1020;--surf:#161A2E;--raise:#1F2440;--line:#2A3052;--text:#EEF0FF;--mut:#9199BE;
    --acc:#7A66FF;--acc-ink:#FFFFFF;--hot:#FF4F93;--body:#262C4E;--muscle:#3A4270;
    --ok:#3CCB8A;--bad:#FF6B86;--shadow:0 12px 34px rgba(0,0,0,.45);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1020;--surf:#161A2E;--raise:#1F2440;--line:#2A3052;--text:#EEF0FF;--mut:#9199BE;
  --acc:#7A66FF;--acc-ink:#FFFFFF;--hot:#FF4F93;--body:#262C4E;--muscle:#3A4270;
  --ok:#3CCB8A;--bad:#FF6B86;--shadow:0 12px 34px rgba(0,0,0,.45);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;min-height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 16px/1.45 var(--f-b);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.mut{color:var(--mut)}.sm-t{font-size:13px}.tc{text-align:center}
.ic{flex:none;display:block}

/* layout */
.main{min-height:100vh;padding-bottom:150px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;max-width:860px;margin:0 auto}
.mark{font:800 26px/1 var(--f-d);letter-spacing:-.04em;display:flex;align-items:center;gap:8px}
.mark i{width:12px;height:12px;border-radius:4px;background:var(--hot);transform:rotate(12deg);display:block}
.tools{display:flex;gap:6px}
.ib{width:42px;height:42px;border-radius:13px;background:var(--surf);border:1px solid var(--line);display:grid;place-items:center}
.ib.flat{background:none;border-color:transparent}
.wrap{max-width:860px;margin:0 auto;padding:4px 16px 0}
.pg{font:800 32px/1.05 var(--f-d);letter-spacing:-.035em;margin:6px 0 16px}
.nav{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--surf);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 10px;border-radius:14px;font-size:11.5px;font-weight:700;color:var(--mut);min-width:60px}
.nav button.on{color:var(--acc)}
.nav button.on svg{stroke-width:2.4}
@media (min-width:900px){
  .nav{top:0;right:auto;width:210px;flex-direction:column;justify-content:flex-start;gap:6px;border-top:0;border-right:1px solid var(--line);padding:84px 14px 14px}
  .nav button{flex-direction:row;gap:12px;font-size:15px;padding:12px 14px;width:100%;justify-content:flex-start}
  .nav button.on{background:var(--raise)}
  .main{margin-left:210px}
  .top{max-width:none;margin-left:0}
  .top .mark{position:fixed;left:24px;top:calc(18px + env(safe-area-inset-top,0px))}
  .top{justify-content:flex-end}
}

/* primitives */
.card{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.card h3{font:800 19px/1.2 var(--f-d);letter-spacing:-.02em}
.card h4{font-weight:700;font-size:15px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.row.top-a{align-items:flex-start}
.grow{flex:1;min-width:0}
.gap{display:grid;gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:760px){.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.cols>.card{margin-bottom:0}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:700;background:var(--raise);color:var(--text);border:1px solid transparent;min-height:46px}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
.btn.sm{padding:8px 14px;min-height:38px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.btn.line{background:none;border-color:var(--line)}
.btn.bad{color:var(--bad)}
.btn[disabled]{opacity:.5}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:700;background:var(--raise);color:var(--text);border:1px solid transparent;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--acc-ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--raise);border-radius:15px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 10px;border-radius:11px;font-weight:700;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--surf);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.field{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--mut)}
.field input,.field select,.field textarea{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-weight:500;color:var(--text);width:100%;min-width:0}
.field textarea{min-height:120px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.bar{height:8px;border-radius:99px;background:var(--raise);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.stat b{display:block;font:800 30px/1 var(--f-d);letter-spacing:-.03em}
.stat span{font-size:13px;color:var(--mut);font-weight:500}
.empty{padding:22px 8px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--text);font:800 18px var(--f-d);margin-bottom:4px}
.div{height:1px;background:var(--line);margin:14px 0}
.tag{font-size:12px;font-weight:700;color:var(--mut);background:var(--raise);padding:3px 9px;border-radius:8px}

/* hero rank */
.hero{display:flex;gap:18px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:28px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.hero .badge{filter:drop-shadow(0 8px 14px rgba(0,0,0,.28))}
.hero h2{font:800 34px/1 var(--f-d);letter-spacing:-.04em}
.badge{display:block;flex:none}

/* body map */
.bm{width:100%;height:auto;display:block}
.bm .bb{fill:var(--body)}
.bm .m0{fill:var(--muscle)}
.bm .mh{fill:var(--hot)}
.bm text{fill:var(--mut);font:700 9px var(--f-b);text-anchor:middle}
.mini{width:76px;flex:none}
.big-map{max-width:360px;margin:0 auto}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);margin-top:8px}
.legend i{flex:1;height:6px;border-radius:9px;background:linear-gradient(90deg,var(--muscle),var(--hot))}

/* exercise rows */
.exgrid{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:640px){.exgrid{grid-template-columns:1fr 1fr}}
.ex{display:flex;gap:12px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:10px 12px;text-align:left;width:100%}
.ex .mini{width:62px}
.ex h4{font-size:15px;line-height:1.2}
.lvl-t{font-weight:800}

/* calendar */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:12px;font-weight:700;color:var(--mut);text-align:center;padding:4px 0}
.day{aspect-ratio:1/1;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:15px;background:transparent;min-width:0}
.day.td{box-shadow:inset 0 0 0 2px var(--acc)}
.day.sel{background:var(--acc);color:var(--acc-ink)}
.dots{display:flex;gap:3px;height:6px}
.dot{width:6px;height:6px;border-radius:50%;display:block}
.dot.done{background:var(--ok)}
.dot.plan{box-shadow:inset 0 0 0 1.5px var(--acc)}
.dot.cr{background:var(--hot)}
.day.sel .dot.done{background:#fff}.day.sel .dot.plan{box-shadow:inset 0 0 0 1.5px #fff}.day.sel .dot.cr{background:#fff}
.day.ck{background:var(--hot);color:#fff}
.day.ck.td{box-shadow:inset 0 0 0 2px var(--text)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mnav b{font:800 18px var(--f-d);text-transform:capitalize}

/* water */
.glasses{display:flex;flex-wrap:wrap;gap:6px}
.glass{width:26px;height:34px;border-radius:5px 5px 9px 9px;border:2px solid var(--line);background:transparent}
.glass.f{background:var(--acc);border-color:var(--acc)}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart .ln{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--acc);opacity:.12}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--mut);font:500 10px var(--f-b)}
.chart circle{fill:var(--surf);stroke:var(--acc);stroke-width:2.5}

/* layers */
.mback{position:fixed;inset:0;z-index:60;background:rgba(6,8,22,.58);display:flex;align-items:flex-end;justify-content:center}
.mback.l2{z-index:66}
.msheet{background:var(--surf);width:100%;max-width:580px;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:0 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media (min-width:700px){.mback{align-items:center}.msheet{border-radius:28px;max-height:88%}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.mh-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;background:var(--surf);padding:16px 0 10px;z-index:2}
.mh-bar h3{font:800 22px/1.1 var(--f-d);letter-spacing:-.03em}
.mbody{display:grid;gap:14px;padding-bottom:4px}
.sess{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.sess-in{max-width:640px;margin:0 auto;padding:0 16px 170px}
.sess-top{position:sticky;top:0;background:var(--bg);z-index:3;display:flex;align-items:center;gap:12px;padding:12px 0}
.sess-top h2{font:800 20px/1.1 var(--f-d);letter-spacing:-.02em}
.pick{position:fixed;inset:0;z-index:62;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.pick-in{max-width:640px;margin:0 auto;padding:0 16px 40px}
.pick-top{position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:3;display:grid;gap:10px}
.sets{display:grid;gap:8px;margin-top:10px}
.set{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:8px;align-items:center}
.set .sn{font-weight:800;color:var(--mut);text-align:center}
.set label{display:grid;position:relative}
.set input{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:11px 8px 17px;font-size:18px;font-weight:700;text-align:center;width:100%;min-width:0}
.set small{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--mut);font-weight:700;pointer-events:none}
.chk{width:46px;height:46px;border-radius:13px;background:var(--raise);display:grid;place-items:center;color:var(--mut)}
.set.done .chk{background:var(--ok);color:#fff}
.set.done input{border-color:var(--ok)}
.num{-moz-appearance:textfield}
.dock{position:fixed;z-index:45;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;justify-items:center;pointer-events:none}
body.sessopen .dock{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){.dock{left:222px;bottom:18px}}
.dock>div{pointer-events:auto;width:100%;max-width:520px}
.restb{background:var(--text);color:var(--bg);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow)}
.restb .bar{background:rgba(127,127,127,.35);margin-top:10px;height:6px}
.restb .bar i{background:var(--hot)}
.restb b{font:800 28px var(--f-d);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.restb .btn{background:rgba(127,127,127,.28);color:inherit;min-height:38px;padding:6px 12px}
.pillb{background:var(--acc);color:var(--acc-ink);border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:700;width:100%;text-align:left;box-shadow:var(--shadow)}
.toast{position:fixed;z-index:90;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.macro{display:grid;gap:6px}
.macro .bar{height:10px}
.big-n{font:800 54px/1 var(--f-d);letter-spacing:-.05em}
.warn{background:var(--raise);border-radius:14px;padding:12px;font-size:14px;border-left:4px solid var(--hot)}
.rowline{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.rowline:last-child{border-bottom:0}
.ladder{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:11.5px;font-weight:700}
.ladder div{background:var(--raise);border-radius:12px;padding:8px 2px}
.ladder b{display:block;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gt0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8AA78"/><stop offset="1" stop-color="#A5622C"/></linearGradient>
    <linearGradient id="gt1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EDF1F8"/><stop offset="1" stop-color="#8795AD"/></linearGradient>
    <linearGradient id="gt2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFDC78"/><stop offset="1" stop-color="#CC8508"/></linearGradient>
    <linearGradient id="gt3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A6F3E6"/><stop offset="1" stop-color="#26A097"/></linearGradient>
    <linearGradient id="gt4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#97CCFF"/><stop offset="1" stop-color="#2A68DC"/></linearGradient>
    <linearGradient id="gt5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DBA9FF"/><stop offset="1" stop-color="#7430D4"/></linearGradient>
    <linearGradient id="gt6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF93AD"/><stop offset="1" stop-color="#D0113A"/></linearGradient>
  </defs>
</svg>
<div class="main">
  <header class="top">
    <div class="mark"><i></i>swole</div>
    <div class="tools">
      <button class="ib" data-a="theme" id="themeBtn" aria-label="Cambiar tema"></button>
      <button class="ib" data-a="profile" aria-label="Perfil"></button>
    </div>
  </header>
  <main class="wrap" id="view"></main>
</div>
<nav class="nav" id="nav" aria-label="Secciones"></nav>
<div class="dock" id="dock"><div id="pill"></div><div id="restbar"></div></div>
<div id="sess"></div>
<div id="picker"></div>
<div id="modal"></div>
<div id="modal2"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ============ Datos fijos ============ */
const TIERS=['Bronce','Plata','Oro','Platino','Diamante','Campeón','Élite'];
const TCOL=['#C27A3F','#8794AC','#CC8A12','#1F9E95','#2F73E0','#8F43EA','#DA2A52'];
const MUSC={pecho:'Pecho',hombros:'Hombros',biceps:'Bíceps',triceps:'Tríceps',antebrazos:'Antebrazos',abs:'Abdominales',oblicuos:'Oblicuos',trapecio:'Trapecio',dorsales:'Dorsales',lumbar:'Espalda baja',gluteos:'Glúteos',cuadriceps:'Cuádriceps',isquios:'Isquiotibiales',gemelos:'Gemelos'};
const LOWER=['cuadriceps','gluteos','isquios','gemelos','lumbar'];
const GROUPS={Pecho:['pecho'],Espalda:['dorsales','trapecio','lumbar'],Hombros:['hombros'],Brazos:['biceps','triceps','antebrazos'],Piernas:['cuadriceps','gluteos','isquios','gemelos'],Core:['abs','oblicuos']};
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIAS3={1:'Lun',2:'Mar',3:'Mié',4:'Jue',5:'Vie',6:'Sáb',0:'Dom'};
const ACT=[{f:1.2,l:'Sedentario (poco ejercicio)'},{f:1.375,l:'Ligero (1-3 días por semana)'},{f:1.55,l:'Moderado (3-5 días por semana)'},{f:1.725,l:'Alto (6-7 días por semana)'}];
const GOALS={bulk:'Volumen',recomp:'Recomp',cut:'Cut'};

function E(id,n,eq,p,s,d,st,o){return Object.assign({id,n,eq,p,s,d,st:st||null,reg:LOWER.includes(p[0])?'l':'u'},o||{});}
/* st = [razón 1RM/peso corporal en Bronce 1, razón en Élite] para un hombre adulto.
   Las filas con ph usan peso por mancuerna. bw = fracción del peso corporal que se mueve. */
const EX=[
E('bench','Press banca','Barra',['pecho'],['triceps','hombros'],'Bajá la barra hasta el pecho y empujá sin despegar la espalda del banco.',[.30,2.10]),
E('incbench','Press inclinado','Barra',['pecho'],['hombros','triceps'],'Banco a 30°. Bajá la barra a la parte alta del pecho y empujá.',[.25,1.75]),
E('dbpress','Press con mancuernas','Mancuernas',['pecho'],['triceps','hombros'],'Empujá las mancuernas hacia arriba juntándolas sin chocarlas.',[.12,.85],{ph:1}),
E('dbfly','Aperturas con mancuernas','Mancuernas',['pecho'],['hombros'],'Abrí los brazos con codos semiflexionados y volvé apretando el pecho.',[.04,.38],{ph:1}),

const Store=(()=>{
  const K='swole.v1';let mem=null;
  return{
    load(){try{const r=localStorage.getItem(K);if(r)return JSON.parse(r);}catch(e){}return mem?JSON.parse(mem):null;},
    save(d){const s=JSON.stringify(d);mem=s;try{localStorage.setItem(K,s);}catch(e){}},
    wipe(){mem=null;try{localStorage.removeItem(K);}catch(e){}}
  };
})();
const defaults=()=>({v:1,profile:null,routines:[],customEx:[],plan:{},logs:[],weights:[],creatine:{},water:{},settings:{theme:'auto',rest:90,remind:{on:false,time:'09:00'},lastRemind:''},active:null,clock:{},del:{}});
function normalize(x){const d=defaults();const o=Object.assign(d,x||{});o.settings=Object.assign(d.settings,(x&&x.settings)||{});o.settings.remind=Object.assign({on:false,time:'09:00'},o.settings.remind||{});
  ['routines','customEx','logs','weights'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[];});
  ['plan','creatine','water','clock','del'].forEach(k=>{if(!o[k]||typeof o[k]!=='object'||Array.isArray(o[k]))o[k]={};});
  /* los IDs van dentro de atributos HTML: si vienen de un archivo importado raro, los limpio
     (siempre igual, así las referencias entre rutinas, entrenos y ejercicios siguen coincidiendo) */
  const sid=x=>String(x==null?'':x).replace(/[^\w-]/g,'');
  o.customEx.forEach(e=>{e.id=sid(e.id);});
  o.routines.forEach(r=>{r.id=sid(r.id);(r.items||[]).forEach(i=>{i.ex=sid(i.ex);});});
  o.logs.forEach(l=>{l.id=sid(l.id);if(l.routineId)l.routineId=sid(l.routineId);(l.entries||[]).forEach(en=>{en.ex=sid(en.ex);});l.prs=(l.prs||[]).map(sid);});
  Object.keys(o.plan).forEach(k=>{o.plan[k]=(Array.isArray(o.plan[k])?o.plan[k]:[]).map(sid);});
  if(o.active&&Array.isArray(o.active.entries))o.active.entries.forEach(en=>{en.ex=sid(en.ex);});
  return o;}
let db=normalize(Store.load());

/* ============ Sincronización: marcas de cambio ============
   Cada cosa sincronizable tiene una clave ("logs:abc", "creatine:2026-11-05", "profile"...).
   Al guardar se compara con la foto anterior: lo que cambió recibe la hora en db.clock y
   lo que desapareció queda anotado como borrado en db.del. Al unir dos dispositivos, por
   cada clave gana lo más reciente (y un borrado más nuevo le gana a la cosa). */
const SYNC_COLL={logs:'id',routines:'id',customEx:'id',weights:'date'};
const SYNC_MAP=['creatine','water'];
const SYNC_ONE=['profile','plan','settings'];
function syncKeys(d){
  const m={};
  for(const c in SYNC_COLL){const k=SYNC_COLL[c];(d[c]||[]).forEach(x=>{if(x&&x[k]!=null)m[c+':'+x[k]]=JSON.stringify(x);});}
  SYNC_MAP.forEach(c=>Object.keys(d[c]||{}).forEach(k=>{m[c+':'+k]=JSON.stringify(d[c][k]);}));
  SYNC_ONE.forEach(c=>{m[c]=JSON.stringify(d[c]==null?null:d[c]);});
  return m;
}
let snap=syncKeys(db);
function stamp(){
  const now=Date.now(),cur=syncKeys(db);let ch=false;
  for(const k in cur)if(snap[k]!==cur[k]){db.clock[k]=now;delete db.del[k];ch=true;}
  for(const k in snap)if(!(k in cur)){db.del[k]=now;delete db.clock[k];ch=true;}
  snap=cur;return ch;
}
function save(){const ch=stamp();Store.save(db);if(ch){try{Sync.schedule();}catch(e){}}}

const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dkey(new Date());
const parseK=k=>{const a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const addDays=(k,n)=>{const d=parseK(k);d.setDate(d.getDate()+n);return dkey(d);};
const longDate=k=>{const d=parseK(k);return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()];};
const shortDate=ms=>{const d=new Date(ms);return d.getDate()+' '+MESES[d.getMonth()].slice(0,3);};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const num=(x,d)=>{const v=Math.round(x*Math.pow(10,d||0))/Math.pow(10,d||0);return String(v).replace('.',',');};
const nf=n=>Math.round(n).toLocaleString('es-UY');
const kgUp=x=>String(Math.ceil(x*2)/2).replace('.',',');
const fmtT=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+':'+pad(m):m)+':'+pad(s%60);};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const allEx=()=>EX.concat(db.customEx);
const exById=id=>allEx().find(e=>e.id===id);
const groupOf=ex=>{const p=ex.p[0];for(const g in GROUPS)if(GROUPS[g].includes(p))return g;return 'Core';};

/* ============ Niveles ============ */
function ageF(a){if(a<=14)return .72;if(a<20)return .72+(a-14)*.28/6;if(a<=39)return 1;return Math.max(.55,1-(a-39)*.012);}
function sexF(s,reg){const u=reg==='u';if(s==='m')return 1;if(s==='f')return u?.6:.72;return u?.8:.86;}
function e1(ex,kg,reps){
  if(ex.time)return Math.max(0,+reps||0); /* ejercicios por tiempo: el récord son los segundos */
  const bw=db.profile?db.profile.weight:70;
  const load=(ex.bw||0)*bw+(+kg||0);
  const r=Math.min(+reps||0,ex.bw?30:15);
  return r>0?load*(1+r/30):0;
}
function stdFor(ex){
  const p=db.profile,b=ex.bw||0,sf=sexF(p.sex,ex.reg)*ageF(p.age);
  const f=x=>(b+(x-b)*sf)*p.weight;
  /* escala exigente: los primeros rangos cuestan un poco más y Élite es nivel competitivo */
  return{lo:f(b?ex.st[0]:ex.st[0]*1.3),hi:f(b?ex.st[1]:ex.st[1]*1.1)};
}
function levelIdx(ex,e){
  if(!ex.st||!db.profile)return null;
  const s=stdFor(ex);
  if(e<s.lo)return -1;
  return Math.min(18,Math.floor(18*(e-s.lo)/(s.hi-s.lo)));
}
function thr(ex,L){const s=stdFor(ex);return s.lo+(s.hi-s.lo)*L/18;}
function lvlName(L){if(L==null||L<0)return 'Sin rango';if(L>=18)return 'Élite';return TIERS[Math.floor(L/3)]+' '+(L%3+1);}
function lvlInfo(ex,e){
  const s=stdFor(ex),L=levelIdx(ex,e);
  if(L<0)return{L,pct:e/s.lo,next:0,need:s.lo-e};
  if(L>=18)return{L,pct:1,next:null,need:0};
  const frac=18*(e-s.lo)/(s.hi-s.lo)-L;
  return{L,pct:frac,next:L+1,need:thr(ex,L+1)-e};
}
function equiv(ex,e){
  const bw=db.profile.weight;
  if(ex.bw){
    const base=ex.bw*bw,n=Math.ceil(30*(e/base-1));
    if(n>=1&&n<=25)return n+' repeticiones con tu peso';
    return kgUp(e/(1+5/30)-base)+' kg extra × 5 repeticiones';
  }
  return kgUp(e/(1+5/30))+' kg'+(ex.ph?' por mancuerna':'')+' × 5 repeticiones';
}
function bestE1(id){
  const ex=exById(id);if(!ex)return null;
  let best=null;
  db.logs.forEach(l=>l.entries.forEach(en=>{
    if(en.ex!==id)return;
    en.sets.forEach(s=>{const e=e1(ex,s.kg,s.reps);if(e>0&&(!best||e>best.e))best={e,kg:s.kg,reps:s.reps,date:l.date};});
  }));
  return best;
}
function lastSets(id){
  const ls=db.logs.filter(l=>l.entries.some(en=>en.ex===id)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  if(!ls.length)return null;
  return ls[ls.length-1].entries.find(en=>en.ex===id).sets;
}
function rankedList(){
  const out=[];
  if(!db.profile)return out;
  allEx().forEach(ex=>{
    if(!ex.st)return;
    const b=bestE1(ex.id);if(!b)return;
    out.push({ex,b,info:lvlInfo(ex,b.e)});
  });
  return out.sort((a,b)=>(b.info.L-a.info.L)||(b.info.pct-a.info.pct));
}
/* Rango general: el mejor ejercicio de cada grupo muscular, promediado.
   Así probar un ejercicio nuevo nunca te baja el rango; entrenar un grupo nuevo sí cuenta. */
function overall(){
  const best={};
  rankedList().filter(x=>x.info.L>=0).forEach(x=>{
    const g=groupOf(x.ex),v=x.info.L+clamp(x.info.pct,0,.999);
    if(!best[g]||v>best[g])best[g]=v;
  });
  const vals=Object.values(best);
  if(!vals.length)return null;
  const avg=vals.reduce((s,v)=>s+v,0)/vals.length;
  const L=Math.min(18,Math.floor(avg));
  return{L,pct:L>=18?1:avg-L,n:vals.length};
}
function e1Points(id){
  const ex=exById(id),map={};
  db.logs.forEach(l=>l.entries.forEach(en=>{
    if(en.ex!==id)return;
    en.sets.forEach(s=>{const e=e1(ex,s.kg,s.reps);if(e>(map[l.date]||0))map[l.date]=e;});
  }));
  return Object.keys(map).sort().map(d=>({t:parseK(d).getTime(),y:map[d]}));
}

/* ============ Nutrición ============ */
function nutri(p){
  const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='m'?5:p.sex==='f'?-161:-78);
  const tdee=bmr*(ACT[p.activity]||ACT[2]).f;
  const adj={bulk:.12,recomp:0,cut:p.age<18?-.08:-.18}[p.goal];
  let kcal=tdee*(1+adj);
  if(p.goal==='cut')kcal=Math.max(kcal,bmr);
  const prot=p.weight*{bulk:1.8,recomp:2.0,cut:2.2}[p.goal];
  let fat=p.weight*.9;
  let carbs=(kcal-prot*4-fat*9)/4;
  if(carbs<0){fat=p.weight*.7;carbs=Math.max(0,(kcal-prot*4-fat*9)/4);}
  return{bmr,tdee,kcal:Math.round(kcal/10)*10,prot:Math.round(prot),fat:Math.round(fat),carbs:Math.round(carbs)};
}

/* ============ Planificación, rachas, volumen ============ */
function plannedFor(dk){
  const dow=parseK(dk).getDay(),ids=new Set(db.plan[dk]||[]);
  db.routines.forEach(r=>{if(r.days&&r.days.includes(dow)&&dk>=(r.since||'0000-00-00'))ids.add(r.id);});
  return[...ids].map(id=>db.routines.find(r=>r.id===id)).filter(Boolean);
}
const doneOn=dk=>db.logs.filter(l=>l.date===dk);
function streak(){
  const t=today();let d=t,n=0,rest=0;
  if(!doneOn(t).length)d=addDays(t,-1);
  for(let i=0;i<400;i++){
    if(doneOn(d).length){n++;rest=0;}
    else if(plannedFor(d).length)break;
    else{rest++;if(rest>2)break;}
    d=addDays(d,-1);
  }
  return n;
}
function weekStats(){
  const t=today(),from=addDays(t,-6),m={};let sessions=0,sets=0;
  db.logs.filter(l=>l.date>=from&&l.date<=t).forEach(l=>{
    sessions++;
    l.entries.forEach(en=>{
      const ex=exById(en.ex);if(!ex)return;
      const n=en.sets.length;sets+=n;
      ex.p.forEach(k=>m[k]=(m[k]||0)+n);
      ex.s.forEach(k=>m[k]=(m[k]||0)+n*.5);
    });
  });
  return{m,sessions,sets};
}
function mapOf(ex){const I={};ex.p.forEach(k=>I[k]=1);ex.s.forEach(k=>{if(!I[k])I[k]=.45;});return I;}
function mapOfRoutine(r){
  const I={};
  r.items.forEach(it=>{const ex=exById(it.ex);if(!ex)return;ex.p.forEach(k=>I[k]=Math.min(1,(I[k]||0)+.4));ex.s.forEach(k=>I[k]=Math.min(1,(I[k]||0)+.15));});
  return I;
}

/* ============ Gráfico de línea ============ */
function chart(pts,unit){
  if(!pts.length)return '<p class="mut sm-t">Todavía no hay datos para graficar.</p>';
  const W=320,H=150,pl=34,pr=12,pt=10,pb=24;
  const ys=pts.map(p=>p.y);let lo=Math.min.apply(null,ys),hi=Math.max.apply(null,ys);
  if(hi-lo<1){lo-=1;hi+=1;}
  const m=(hi-lo)*.15;lo-=m;hi+=m;
  const t0=pts[0].t,t1=pts[pts.length-1].t;
  const X=t=>pl+(t1===t0?(W-pl-pr)/2:(t-t0)/(t1-t0)*(W-pl-pr));
  const Y=y=>pt+(1-(y-lo)/(hi-lo))*(H-pt-pb);
  const line=pts.map((p,i)=>(i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const area=line+' L'+X(t1).toFixed(1)+' '+(H-pb)+' L'+X(t0).toFixed(1)+' '+(H-pb)+'Z';
  let g='';
  [lo+m,(lo+hi)/2,hi-m].forEach(v=>{g+='<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text x="'+(pl-5)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end">'+Math.round(v)+'</text>';});
  const dots=pts.length<=24?pts.map(p=>'<circle cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="3.5"/>').join(''):'';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de progreso en '+unit+'">'+g+
   (pts.length>1?'<path class="ar" d="'+area+'"/>':'')+'<path class="ln" d="'+line+'"/>'+dots+
   '<text x="'+pl+'" y="'+(H-6)+'">'+shortDate(t0)+'</text>'+(pts.length>1?'<text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end">'+shortDate(t1)+'</text>':'')+'</svg>';
}

function mkEntry(id,n,reps){
  const ls=lastSets(id),sets=[];
  for(let i=0;i<n;i++){const l=ls&&(ls[i]||ls[ls.length-1]);sets.push({kg:l&&l.kg?l.kg:'',reps:reps,done:false});}
  return{ex:id,sets};
}
function startSession(rid,dk){

  db.active={id:uid(),date:dk||today(),routineId:r?r.id:null,name:r?r.name:'Entrenamiento libre',t0:Date.now(),entries:(r?r.items:[]).map(it=>mkEntry(it.ex,it.sets,it.reps))};

function finishSession(){
  const a=db.active;
  const entries=a.entries.map(en=>({ex:en.ex,sets:en.sets.filter(s=>s.done&&(+s.reps)>0).map(s=>({kg:+s.kg||0,reps:+s.reps}))})).filter(en=>en.sets.length);
  if(!entries.length){toast('Marcá al menos una serie como hecha');return;}
  const before={};
  entries.forEach(en=>{const ex=exById(en.ex),b=bestE1(en.ex);before[en.ex]={e:b?b.e:0,L:ex&&ex.st?(b?levelIdx(ex,b.e):-1):null};});
  const log={id:a.id,date:a.date,name:a.name,routineId:a.routineId,dur:Math.max(1,Math.round((Date.now()-a.t0)/60000)),entries,prs:[]};
  db.logs.push(log);
  const prs=[],ups=[];
  entries.forEach(en=>{
    const ex=exById(en.ex),b=bestE1(en.ex),bf=before[en.ex];
    if(!ex||!b)return;
    if(bf.e>0&&b.e>bf.e+.01){prs.push({ex:ex.id,e:b.e});log.prs.push(ex.id);}
    if(ex.st&&bf.L!=null){const L=levelIdx(ex,b.e);if(L>bf.L&&L>=0)ups.push({ex:ex.id,from:bf.L,to:L});}
  });
  let vol=0,sets=0;
  /* en ejercicios con peso corporal (dominadas, fondos...) también cuenta la parte del cuerpo que movés */
  const bwKg=weightNow()||70;
  entries.forEach(en=>{const ex=exById(en.ex);en.sets.forEach(s=>{sets++;if(ex&&!ex.time)vol+=((ex.bw||0)*bwKg+s.kg)*s.reps;});});
  db.active=null;save();endRest(false);S.sessOpen=false;
  S.modal={t:'summary',log,prs,ups,vol,sets};render();
}

let restT=null,audioCtx=null;
function unlockAudio(){try{if(!audioCtx){const A=window.AudioContext||window.webkitAudioContext;if(A)audioCtx=new A();}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}catch(e){}}
function beep(){
  try{if(audioCtx){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=880;const n=audioCtx.currentTime;g.gain.setValueAtTime(.001,n);g.gain.exponentialRampToValueAtTime(.3,n+.03);g.gain.exponentialRampToValueAtTime(.001,n+.6);o.start();o.stop(n+.65);}}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,80,200]);}catch(e){}
}
function startRest(sec){S.rest={end:Date.now()+sec*1000,total:sec};clearInterval(restT);restT=setInterval(restTick,250);renderRest();}
function restTick(){

  const b=$('#restT'),f=$('#restF');

function endRest(alarm){clearInterval(restT);S.rest=null;$('#restbar').innerHTML='';if(alarm){beep();toast('Descanso terminado');}}

/* En Android las notificaciones solo funcionan a través del service worker */
function notify(title,body){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    if(navigator.serviceWorker&&navigator.serviceWorker.controller){
      navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:'icons/icon-192.png',badge:'icons/icon-192.png',tag:'swole-crea'})).catch(()=>{});
    }else new Notification(title,{body,icon:'icons/icon-192.png'});
  }catch(e){}
}
async function exportData(){
  const json=JSON.stringify(db,null,1),name='swole-'+today()+'.json';
  /* En celular (sobre todo iPhone instalado) la descarga directa no anda: uso el menú de compartir */
  try{
    if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&window.File){
      const f=new File([json],name,{type:'application/json'});
      if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});db.settings.lastBackup=today();save();toast('Copia guardada');return;}
    }
  }catch(e){if(e&&e.name==='AbortError')return;}
  try{
    if(window.claude&&claude.use){
      const dl=await claude.use('downloads');
      if(dl){await dl.save({filename:name,data:json});toast('Archivo listo: '+name);return;}
    }
  }catch(e){if(e&&e.code==='declined')return;}
  try{
    const b=new Blob([json],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
    db.settings.lastBackup=today();save();
    toast('Descargando '+name);
  }catch(e){
    try{await navigator.clipboard.writeText(json);toast('Datos copiados al portapapeles');}
    catch(e2){S.m2={t:'import',text:json};render();toast('Copiá este texto para guardar tus datos');}
  }
}

/* ============ Sincronización con Supabase ============ */
function mergeDb(L,R){
  const cl={},dl={},clone=x=>x==null?x:JSON.parse(JSON.stringify(x));
  [L.clock,R.clock].forEach(o=>{for(const k in o)cl[k]=Math.max(cl[k]||0,+o[k]||0);});
  [L.del,R.del].forEach(o=>{for(const k in o)dl[k]=Math.max(dl[k]||0,+o[k]||0);});
  /* elige entre la versión local (a) y la remota (b) de una clave */
  const pick=(k,a,b)=>{
    const ta=a!==undefined?(L.clock[k]||0):-1,tb=b!==undefined?(R.clock[k]||0):-1;
    const v=tb>ta?b:(a!==undefined?a:b),t=Math.max(ta,tb),d=dl[k]||0;
    return d&&d>=t?undefined:clone(v);
  };
  const out=normalize(clone(L));
  for(const c in SYNC_COLL){
    const key=SYNC_COLL[c],la=new Map(),ra=new Map();
    (L[c]||[]).forEach(x=>la.set(String(x[key]),x));(R[c]||[]).forEach(x=>ra.set(String(x[key]),x));
    const ids=[...la.keys()];ra.forEach((_,id)=>{if(!la.has(id))ids.push(id);});
    out[c]=ids.map(id=>pick(c+':'+id,la.get(id),ra.get(id))).filter(x=>x!==undefined);
  }
  SYNC_MAP.forEach(c=>{
    const m={},ks=new Set(Object.keys(L[c]||{}).concat(Object.keys(R[c]||{})));
    ks.forEach(k=>{const v=pick(c+':'+k,(L[c]||{})[k],(R[c]||{})[k]);if(v!==undefined)m[k]=v;});
    out[c]=m;
  });
  const empty=v=>v==null||(typeof v==='object'&&!Object.keys(v).length);
  SYNC_ONE.forEach(c=>{
    const lt=L.clock[c]||0,rt=R.clock[c]||0;
    /* empate (datos de antes de sincronizar): gana la nube, salvo que esté vacía */
    out[c]=clone(rt>lt||(rt===lt&&!empty(R[c]))?R[c]:L[c]);
  });
  out.settings=normalize({settings:out.settings}).settings;
  /* los borrados de hace más de un año ya no hacen falta */
  const old=Date.now()-365*864e5;for(const k in dl)if(dl[k]<old)delete dl[k];
  out.clock=cl;out.del=dl;out.active=L.active;
  return out;
}
