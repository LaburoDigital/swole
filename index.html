<!-- Seguridad (CSP): la página solo puede cargar y hablar con lo que la app usa. Si se suma un servicio nuevo, hay que agregarlo acá.
     script: los js/ propios + jsdelivr (ZXing y transformers.js) + WebAssembly del modelo de la foto. Sin scripts inline ni eval.
       blob: lo necesita el motor del modelo (ONNX) para cargar su propio WebAssembly; un blob: solo lo crea código que ya corre acá.
     style: 'unsafe-inline' porque la app usa style="" en el HTML que arma (no ejecuta código).
     connect: Supabase del proyecto, Open Food Facts, Spotify, jsdelivr y Hugging Face (el modelo de la foto de comida).
       data:/blob: porque el modelo lee la foto del plato (una data: del canvas) con fetch; no salen a la red. -->
