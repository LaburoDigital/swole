# Compila el APK de prueba de Swole en la nube (no hace falta instalar nada en la compu).
# Se corre a mano desde la pestaña Actions de GitHub, o solo cuando cambia la carpeta native/.
name: APK de Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run sync
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: native/android
      - uses: actions/upload-artifact@v4
        with:
          name: swole-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
