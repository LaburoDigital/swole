# Pruebas automáticas de Swole: niveles, generador de rutinas y "todo ejercicio tiene técnica y detalle".
# Corren en cada push y en cada pull request. Si algo se rompe, la tilde queda en rojo en GitHub.
name: Pruebas
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
